:root{--accent:#ef4444;--accent-rgb:239,68,68;--font-display:'Bebas Neue',sans-serif;--font-ui:'IBM Plex Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d0d;color:#e8e8e8;font-family:'Raleway',sans-serif;overflow:hidden}

/* ── Upload overlay ── */
#upload-overlay{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100dvh;padding:2rem;gap:1.2rem;text-align:center;
}
#upload-overlay.hidden{display:none}
.upload-title{font-family:var(--font-display);font-size:clamp(42px,12vw,72px);letter-spacing:6px;color:#e8e8e8;line-height:1}
.upload-title em{color:var(--accent);font-style:normal}
.upload-sub{font-family:var(--font-ui);font-size:12px;color:#666;letter-spacing:1px;max-width:360px}
.upload-zone{
  position:relative;border:1px dashed #333;border-radius:8px;padding:2rem 2.5rem;
  cursor:pointer;transition:all .4s;max-width:360px;width:100%;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(var(--accent-rgb),.05)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-label{font-size:14px;color:#888}
.upload-label strong{color:var(--accent)}
.upload-fname{font-family:var(--font-ui);font-size:11px;color:var(--accent);margin-top:6px}
.upload-skip{font-size:13px;color:#555;background:none;border:none;cursor:pointer;text-decoration:underline}

/* ── Main app shell ── */
#app{display:none;flex-direction:column;height:100dvh;position:relative}
#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:1.2rem}

/* ── Reader modal (full-screen page-flip) ── */
#rm{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;
  cursor:default;user-select:none;
  animation:modalIn .18s ease;
  background:#0d0d0d;
  overflow:hidden;
}
@keyframes modalIn{from{opacity:0}to{opacity:1}}
@keyframes modalOut{from{opacity:1}to{opacity:0}}

/* ── Reader bar (top) ── */
.rm-bar{
  position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 18px 22px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  transition:opacity .5s ease,transform .5s ease;
}
#rm.bar-hidden .rm-bar{opacity:0;pointer-events:none;transform:translateY(-100%)}
.rm-bar-title{font-family:var(--font-display);font-size:18px;letter-spacing:3px}
.rm-bar-sub{font-family:var(--font-ui);font-style:italic;font-size:11px;font-weight:300;margin-top:2px;letter-spacing:.3px;opacity:.5}
.rm-bar-actions{display:flex;gap:8px;align-items:center}
.rm-bar-cfg{
  padding:6px 12px;border-radius:3px;border:1px solid rgba(255,255,255,.12);
  background:transparent;cursor:pointer;color:inherit;font-size:14px;font-weight:700;
  transition:all .36s;
}
.rm-bar-cfg:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.rm-bar-x{
  padding:6px 12px;border-radius:3px;border:1px solid rgba(255,255,255,.12);
  background:transparent;cursor:pointer;color:inherit;font-size:14px;
  transition:all .36s;
}
.rm-bar-x:hover{background:rgba(155,28,44,.15);border-color:rgba(224,48,80,.3);color:var(--accent)}

/* Hide bar toggle button (floats when bar is hidden) */


/* ── Reader content clip + strip (CSS columns) ── */
.rm-clip{flex:1;overflow:hidden;position:relative;cursor:default;user-select:none;-webkit-touch-callout:none}
.rm-strip p{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;cursor:text}
.rm-strip{transition:transform .575s cubic-bezier(.4,0,.2,1);width:100%}
.rm-strip p{box-sizing:border-box;margin:-.45em 0 .85em;padding:.45em .9em .45em .72em;break-inside:auto;page-break-inside:auto;orphans:1;widows:1;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
.rm-strip p::-webkit-scrollbar{width:3px}
.rm-strip p::-webkit-scrollbar-track{background:transparent}
.rm-strip p::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.2)}
/* Chapter heading inside strip */
.rm-strip .ss-ch-head{
  font-family:var(--font-display);
  font-size:1.5em;letter-spacing:3px;
  margin:0 0 .6em;
}
/* A chapter flows through its own columns. The reader sets the chapters side by side. */
.rm-ch{position:absolute;top:0;left:0;width:var(--col-w);height:var(--col-h);column-width:var(--col-w);column-gap:var(--col-gap);column-fill:auto;overflow:visible}
.rm-strip .ss-ch-head em{color:var(--accent);font-style:normal}
.rm-strip .ss-timed{position:relative;z-index:1;cursor:pointer}
/* Active paragraph marker — visuals drawn by .ss-hl-frag overlays in JS */
.rm-strip p.ss-active{}
.ss-hl-frag{position:absolute;pointer-events:none;z-index:0;border-radius:4px;}/* ── Click zones (left/right page flip) ── */
.rm-zone{position:absolute;top:0;bottom:0;width:35%;z-index:1}
.rm-zone-l{left:0}.rm-zone-r{right:0}
/* When player is visible, shrink click zones to not overlap player */
#rm.player-visible .rm-zone{bottom:var(--player-h,110px)}

/* ── Page number ── */
.rm-num{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%);
  font-family:var(--font-ui);font-size:10px;letter-spacing:2px;
  pointer-events:none;z-index:5;
}
.rm-ch-pages{
  position:fixed;bottom:22px;right:28px;
  font-family:var(--font-ui);font-size:10px;letter-spacing:.8px;
  pointer-events:none;z-index:5;
  opacity:0;transition:opacity .25s;
  text-align:right;line-height:1.7;
}
.rm-ch-pages.show{opacity:1;}

/* ── Settings overlay ── */
.rm-cfg{
  position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s;
}
.rm-cfg.show{opacity:1;pointer-events:all}
.rm-cfg-card{
  border-radius:10px;padding:20px;width:min(380px,90vw);
  border:1px solid;max-height:85vh;overflow-y:auto;
}
.rm-cfg-title{font-family:var(--font-display);font-size:18px;letter-spacing:4px;padding-bottom:14px;border-bottom:1px solid;margin-bottom:16px}
.rm-cfg-fs{display:flex;align-items:center;gap:4px;margin-bottom:16px;border-radius:4px;padding:6px;border:1px solid;overflow:hidden}
.rm-cfg-fs-btn{padding:8px 14px;border-radius:3px;border:none;cursor:pointer;font-weight:700;transition:all .36s;background:transparent;flex:0}
.rm-cfg-fs-btn.small{font-size:13px}.rm-cfg-fs-btn.large{font-size:20px}.rm-cfg-fs-btn.mode-btn{font-size:16px;margin-left:auto}
.rm-cfg-fs-sep{width:1px;align-self:stretch;flex-shrink:0}
.rm-cfg-fs-val{font-family:var(--font-ui);font-size:10px;padding:0 8px;flex:1;text-align:center}
.rm-cfg-themes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.rm-cfg-th{flex:1;min-width:64px;padding:12px 8px;border-radius:6px;cursor:pointer;text-align:center;position:relative;border:1px solid rgba(255,255,255,.1);transition:all .4s}
.rm-cfg-th:hover{border-color:rgba(var(--accent-rgb),.4)}.rm-cfg-th.active{border-color:rgba(var(--accent-rgb),.6)}
.rm-cfg-th-preview{font-size:18px;font-weight:700;margin-bottom:4px}
.rm-cfg-th-name{font-family:var(--font-ui);font-size:7.5px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.rm-cfg-th-sparkle{position:absolute;top:4px;right:6px;font-size:8px;opacity:.5}
.rm-cfg-section{border-top:1px solid;padding-top:12px;margin-top:12px}
.rm-cfg-section-title{font-family:var(--font-ui);font-size:8px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;opacity:.5}
.rm-cfg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid}
.rm-cfg-row-label{font-family:'Raleway',sans-serif;font-size:13px;flex:1}
.rm-cfg-row-icon{font-size:12px;font-family:var(--font-ui);font-weight:700;width:20px;text-align:center;opacity:.5}
.rm-cfg-select{padding:5px 10px;border-radius:3px;border:1px solid;font-family:'Raleway',sans-serif;font-size:13px;background:transparent;outline:none;cursor:pointer;min-width:90px}
.rm-cfg-toggle{width:40px;height:22px;border-radius:11px;border:1px solid;cursor:pointer;position:relative;transition:background .4s;background:transparent}
.rm-cfg-toggle.on{background:rgba(var(--accent-rgb),.3)}
.rm-cfg-hint{display:none;font-size:10.5px;opacity:.55;margin-top:2px}
.rm-cfg-toggle-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:currentColor;transition:transform .4s;opacity:.7}
.rm-cfg-toggle.on .rm-cfg-toggle-knob{transform:translateX(18px)}
.rm-cfg-slider-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid}
.rm-cfg-slider-label{font-family:var(--font-ui);font-size:7.5px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;min-width:90px}
.rm-cfg-slider{flex:1;appearance:none;height:2px;border-radius:2px;outline:none;cursor:pointer}
.rm-cfg-slider::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;cursor:pointer}
.rm-cfg-slider-val{font-family:var(--font-ui);font-size:8px;opacity:.6;min-width:38px;text-align:right}
.rm-cfg-reset{margin-top:14px;width:100%;padding:9px;border-radius:3px;border:1px solid;font-family:var(--font-ui);font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;opacity:.5;transition:opacity .4s;background:transparent}
.rm-cfg-reset:hover{opacity:.85}

/* ── Audio player bar (bottom) ── */
#player{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(13,13,13,.97);border-top:1px solid #1a1a1a;
  padding:8px 16px 12px;
  display:none;
  transition:transform .5s ease;
}
#player.visible{display:block}
#player.bars-hidden{transform:translateY(100%)}

.player-time-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.player-time{font-family:var(--font-ui);font-size:10px;color:#555;white-space:nowrap;min-width:36px}
#seekbar{
  flex:1;height:4px;appearance:none;border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(to right, var(--accent) var(--prog,0%), rgba(255,255,255,.12) var(--prog,0%));
}
#seekbar::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 4px rgba(var(--accent-rgb),.5)}
#seekbar::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#progress-fill{display:none}
.player-controls{display:flex;align-items:center;justify-content:center;gap:10px}
.ctrl-btn{
  padding:6px 14px;border-radius:4px;border:1px solid #222;
  background:transparent;color:#ccc;cursor:pointer;
  font-family:var(--font-ui);font-size:12px;
  transition:all .3s;
}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.active{background:rgba(var(--accent-rgb),.15);border-color:var(--accent);color:var(--accent)}
.ctrl-btn.active.held{background:transparent;border-style:dashed;opacity:.75}
#play-btn{font-size:18px;padding:7px 18px}
#ch-info-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px}
#cur-ch-title{flex:1;text-align:right;font-family:var(--font-ui);font-size:9px;color:#666;letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55vw}
#ch-jump-sel{background:#111;border:1px solid #1e1e1e;color:#555;font-family:var(--font-ui);font-size:8px;letter-spacing:.5px;padding:3px 5px;border-radius:3px;cursor:pointer;outline:none;flex:none;max-width:120px}
#ch-jump-sel option{background:#111;color:#888}

/* Auto-scroll indicator */
#rm .ss-autoscroll-badge{
  position:fixed;bottom:70px;right:14px;z-index:60;
  font-family:var(--font-ui);font-size:8px;letter-spacing:2px;
  text-transform:uppercase;padding:3px 8px;border-radius:20px;
  background:rgba(var(--accent-rgb),.15);border:1px solid rgba(var(--accent-rgb),.3);
  color:var(--accent);pointer-events:none;opacity:0;transition:opacity .8s;
}
#rm .ss-autoscroll-badge.show{opacity:1}

/* ── TOC Sidebar ── */
.rm-toc{
  position:fixed;inset:0;z-index:25;display:flex;pointer-events:none;
}
.rm-toc-backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .44s;pointer-events:none;
}
.rm-toc.show .rm-toc-backdrop{opacity:1;pointer-events:all}
.rm-toc-panel{
  position:relative;z-index:1;
  width:min(300px,82vw);height:100%;
  display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .48s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.rm-toc.show .rm-toc-panel{transform:translateX(0);pointer-events:all}
.rm-toc-head{
  padding:18px 16px 10px;
  font-family:var(--font-display);font-size:15px;letter-spacing:3px;
  border-bottom:1px solid;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.rm-toc-close{
  background:none;border:none;cursor:pointer;font-size:14px;
  color:inherit;opacity:.5;padding:2px 6px;transition:opacity .3s;
}
.rm-toc-close:hover{opacity:1}
.rm-toc-list{
  flex:1;overflow-y:auto;padding:8px 0;
  scrollbar-width:thin;scrollbar-color:rgba(var(--accent-rgb),.25) transparent;
}
.rm-toc-list::-webkit-scrollbar{width:3px}
.rm-toc-list::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.25);border-radius:2px}
.rm-toc-item{
  padding:10px 16px;cursor:pointer;
  font-family:var(--font-ui);font-size:10px;letter-spacing:.8px;
  line-height:1.5;border-left:2px solid transparent;
  transition:background .3s,border-color .3s,color .3s;
  display:flex;align-items:baseline;gap:10px;
}
.rm-toc-item:hover{border-left-color:rgba(var(--accent-rgb),.4)}
.rm-toc-item.toc-active{
  border-left-color:var(--accent);
  font-weight:600;
}
.rm-toc-item-num{
  font-size:8px;opacity:.35;min-width:20px;flex-shrink:0;
}
.rm-toc-item-title{flex:1;opacity:.7}
.rm-toc-item:hover .rm-toc-item-title,.rm-toc-item.toc-active .rm-toc-item-title{opacity:1}

/* TOC button in bar */
.rm-bar-toc{
  padding:6px 12px;border-radius:3px;border:1px solid rgba(255,255,255,.12);
  background:transparent;cursor:pointer;color:inherit;font-size:13px;
  transition:all .36s;letter-spacing:.5px;font-family:var(--font-ui);
}
.rm-bar-toc:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}

/* ── Search panel ── */
.rm-search{position:fixed;top:0;left:0;right:0;z-index:350;transform:translateY(-120%);transition:transform .22s cubic-bezier(.4,0,.2,1);pointer-events:none}
.rm-search.show{transform:translateY(0);pointer-events:all}
.rm-search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(13,13,13,.97);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.rm-search-icon{font-size:15px;opacity:.35;flex-shrink:0}
#rm-search-input{flex:1;background:transparent;border:none;outline:none;color:#e8e8e8;font-family:var(--font-ui);font-size:13px;letter-spacing:.3px}
#rm-search-input::placeholder{color:#3a3a3a}
.rm-search-count{font-family:var(--font-ui);font-size:10px;color:#555;white-space:nowrap;min-width:52px;text-align:right}
.rm-search-nav{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:3px;color:#666;cursor:pointer;width:26px;height:26px;font-size:12px;transition:all .2s;flex-shrink:0}
.rm-search-nav:hover{border-color:rgba(var(--accent-rgb),.4);color:var(--accent)}
.rm-search-close{background:transparent;border:none;color:#444;cursor:pointer;font-size:14px;padding:4px 8px;transition:color .2s;flex-shrink:0}
.rm-search-close:hover{color:var(--accent)}
mark.rm-search-mark{background:rgba(var(--accent-rgb),.2);color:inherit;border-radius:2px;padding:0 1px}
mark.rm-search-mark.rm-search-mark-active{background:rgba(var(--accent-rgb),.45);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35)}


/* ── Player extras ── */
.player-controls{flex-wrap:wrap;row-gap:6px}
#vol{
  width:64px;height:4px;-webkit-appearance:none;appearance:none;border-radius:2px;outline:none;cursor:pointer;
  background:linear-gradient(to right,#999 var(--vol,100%),rgba(255,255,255,.12) var(--vol,100%));
}
#vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:10px;height:10px;border-radius:50%;background:#ccc;cursor:pointer}
#vol::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#ccc;border:none;cursor:pointer}
.sleep-wrap{position:relative;display:inline-flex}
#sleep-menu{
  position:absolute;bottom:calc(100% + 8px);right:0;min-width:160px;z-index:5;display:none;
  background:#111;border:1px solid #222;border-radius:6px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#sleep-menu.show{display:block}
#sleep-menu button{
  display:block;width:100%;text-align:left;padding:8px 10px;border:none;border-radius:4px;
  background:transparent;color:#aaa;cursor:pointer;
  font-family:var(--font-ui);font-size:10px;letter-spacing:1px;text-transform:uppercase;
}
#sleep-menu button:hover{background:rgba(var(--accent-rgb),.12);color:var(--accent)}
#sleep-menu button.on{color:var(--accent)}
@media (max-width:560px){
  .player-controls{gap:5px}
  .ctrl-btn{padding:6px 7px;font-size:11px}
  #play-btn{padding:5px 11px;font-size:16px}
  #vol{display:none}
}

/* ── Bookmarks ── */
.rm-toc-tabs{display:flex;gap:16px}
.rm-toc-tab{background:none;border:none;padding:0;cursor:pointer;color:inherit;font:inherit;letter-spacing:inherit;opacity:.4;transition:opacity .3s}
.rm-toc-tab.on,.rm-toc-tab:hover{opacity:1}
.rm-bm-item{align-items:flex-start}
.rm-bm-body{flex:1;min-width:0}
.rm-bm-meta{font-size:8px;opacity:.45;letter-spacing:1px;margin-bottom:3px}
.rm-bm-text{opacity:.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rm-bm-del{background:none;border:none;color:inherit;opacity:.35;cursor:pointer;font-size:11px;padding:0 2px;flex:none}
.rm-bm-del:hover{opacity:1;color:var(--accent)}
.rm-bm-empty{padding:18px 16px;font-family:var(--font-ui);font-size:10px;letter-spacing:.8px;line-height:1.7;opacity:.5}
.rm-strip p.ss-bm{position:relative}
.rm-strip p.ss-bm::before{content:'';position:absolute;left:.1em;top:1.2em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rm-bar-bm{
  padding:6px 10px;border-radius:3px;border:1px solid rgba(255,255,255,.12);
  background:transparent;cursor:pointer;color:inherit;font-size:13px;transition:all .36s;
}
.rm-bar-bm:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.rm-bar-bm.flash{background:rgba(var(--accent-rgb),.2);border-color:rgba(var(--accent-rgb),.5)}

/* ── Tapped word ── */
.ss-sent-frag{position:absolute;pointer-events:none;z-index:0;box-sizing:content-box;opacity:0;transition:opacity .16s ease}
.ss-word-flash{position:absolute;pointer-events:none;z-index:0;border-radius:4px;background:rgba(var(--accent-rgb),.3);animation:wordFlash .7s ease-out forwards}
@keyframes wordFlash{from{opacity:1}to{opacity:0}}

/* ── Chapter ticks on the seek bar ── */
.seek-wrap{flex:1;position:relative;display:flex;align-items:center}
.seek-wrap #seekbar{width:100%}
#seek-ticks{position:absolute;left:7px;right:7px;top:50%;height:0;pointer-events:none}
.seek-tick{position:absolute;top:-6px;width:1px;height:12px;background:rgba(255,255,255,.34)}

/* ── Book skin: title page, chapter openers, book typesetting ── */
.rm-strip .sc{font-size:.8em;letter-spacing:.06em}
.bk-titlepage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--font-display)}
.bk-tp-title{font-size:min(2.5em,11vh,calc(var(--col-w)*.115));letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
.bk-tp-sub{font-size:min(1.02em,4.6vh);font-style:italic;margin-top:min(1.1em,4vh);color:var(--accent)}
.bk-tp-rule{width:2.6em;height:1px;background:currentColor;opacity:.35;margin:min(2.2em,6vh) 0}
.bk-tp-author{font-size:min(.8em,3.4vh);letter-spacing:.34em;text-transform:uppercase;opacity:.6}
.rm-strip .ss-ch-head.bk-head{font-family:var(--font-display);font-size:1em;letter-spacing:0;text-align:center;margin:0 0 min(1.9em,6vh);padding-top:min(9%,6vh);break-inside:avoid}
.rm-strip .ss-ch-head.bk-head.bk-bare{margin:0;padding-top:min(5%,4vh)}
.bk-num{font-size:min(2.5em,11vh,calc(var(--col-w)/7.5));line-height:1.1;color:var(--accent)}
.bk-num.bk-named{font-size:min(2.2em,10vh);font-style:italic}
.bk-syn{font-size:min(.92em,3.5vh);font-style:italic;line-height:1.45;margin:min(1.1em,3vh) auto 0;max-width:34em;opacity:.62;hyphens:none;-webkit-hyphens:none}
html[data-skin="meridian"] .rm-bar-title{letter-spacing:.2em;font-size:15px;text-transform:uppercase}
html[data-skin="meridian"] .rm-toc-head,html[data-skin="meridian"] .rm-cfg-title{letter-spacing:.2em;font-size:13px}
html[data-skin="meridian"] .upload-title{letter-spacing:.14em;font-size:clamp(30px,8vw,54px);text-transform:uppercase}
html[data-skin="meridian"] .rm-toc-item-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html[data-skin="meridian"] .rm-toc-item-num{min-width:34px;font-size:9px}
@media (max-width:560px){.bk-num{font-size:min(2em,calc(var(--col-w)/7.5))}.bk-syn{font-size:.8em;margin-top:.9em}.rm-strip .ss-ch-head.bk-head{margin-bottom:1.4em}}
</style>
</head>
<body>

<!-- Upload overlay -->
<div id="upload-overlay">
  <div class="upload-title"><em>Audio</em> Reader</div>
  <div class="upload-sub">Load your audiobook file to begin.</div>
  <div class="upload-zone" id="audio-drop">
    <input type="file" accept="audio/*" id="audio-input">
    <div class="upload-icon">🎧</div>
    <div class="upload-label">Drop your <strong>m4b / m4a / mp3</strong> audiobook here</div>
    <div class="upload-fname" id="audio-fname"></div>
  </div>
  <button class="upload-skip" onclick="startWithoutAudio()">Browse text only (no audio)</button>
</div>

<!-- Main app -->
<div id="app">
  <!-- Player bar (shown when audio loaded) -->
  <div id="player">
    <div class="player-time-bar">
      <span class="player-time" id="t-cur">0:00</span>
      <div class="seek-wrap">
        <input type="range" id="seekbar" min="0" max="100" value="0" step="0.1">
        <div id="seek-ticks"></div>
      </div>
      <span class="player-time" id="t-dur" onclick="toggleTimeDisplay()" style="cursor:pointer" title="Toggle remaining time">0:00</span>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" onclick="skip(-30)" title="-30s">«30</button>
      <button class="ctrl-btn" onclick="skip(-5)" title="-5s">«5</button>
      <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="skip(5)" title="+5s">5»</button>
      <button class="ctrl-btn" onclick="skip(30)" title="+30s">30»</button>
      <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()" title="Mute">🔊</button>
      <input type="range" id="vol" min="0" max="1" step="0.05" value="1" title="Volume">
      <button class="ctrl-btn" id="speed-btn" onclick="cycleSpeed()" title="Speed  [ and ]">1×</button>
      <button class="ctrl-btn" id="autoscroll-btn" onclick="toggleAutoPageFlip()" title="Auto page-flip synced to audio">Auto ⟳</button>
      <span class="sleep-wrap">
        <button class="ctrl-btn" id="sleep-btn" onclick="sleepToggleMenu(event)" title="Sleep timer">Zz</button>
        <div id="sleep-menu">
          <button data-sleep="off" onclick="sleepSet('off')">Off</button>
          <button data-sleep="15" onclick="sleepSet(15)">15 minutes</button>
          <button data-sleep="30" onclick="sleepSet(30)">30 minutes</button>
          <button data-sleep="45" onclick="sleepSet(45)">45 minutes</button>
          <button data-sleep="60" onclick="sleepSet(60)">60 minutes</button>
          <button data-sleep="chapter" onclick="sleepSet('chapter')">End of chapter</button>
        </div>
      </span>
    </div>
    <div class="ch-info" id="ch-info-bar">
      <span id="cur-ch-title"></span>
      <select id="ch-jump-sel" onchange="jumpToChapter(parseInt(this.value))"></select>
    </div>
  </div>

  <!-- Shown when the reader is closed -->
  <div id="splash">
    <div class="upload-title" id="splash-title"></div>
    <div class="upload-sub">SYNCED READER</div>
    <button class="ctrl-btn" onclick="openReader(0,0)">Open reader</button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>

const seekbar    = document.getElementById('seekbar');
const tCur       = document.getElementById('t-cur');
const tDur       = document.getElementById('t-dur');
const playBtn    = document.getElementById('play-btn');

let _speeds  = [0.75, 1, 1.1, 1.25, 1.5, 1.75, 2];
let _speedIdx = 1;
let _hasAudio = false;

// Speed, volume and mute carry over between sessions and books
let _playerPrefs = { speed: 1, vol: 1, muted: false };
try { Object.assign(_playerPrefs, JSON.parse(localStorage.getItem('ssPlayerPrefs') || '{}')); } catch(e) {}
function savePlayerPrefs() {
  try { localStorage.setItem('ssPlayerPrefs', JSON.stringify(_playerPrefs)); } catch(e) {}
}

// Flat para index for quick time-lookup
let _flatParas = []; // {start, end, chIdx, paraEl}

function buildFlatParas() {
  _flatParas = [];
  SYNC_DATA.forEach((ch, ci) => {
    const paras = ch.paragraphs;
    // The spoken heading and the synopsis line. Their pi is 'h' and 's'.
    if (ch.head) _flatParas.push({ start: ch.head.start, end: ch.head.end, chIdx: ci, ci, pi: 'h', charMap: null });
    if (ch.syn)  _flatParas.push({ start: ch.syn.start, end: ch.syn.end, chIdx: ci, ci, pi: 's', charMap: ch.syn.charMap || null });
    // Synced paragraphs
    paras.forEach((p, pi) => {
      if (p.start !== null) {
        _flatParas.push({ start: p.start, end: p.end || p.start + 3, chIdx: ci, ci, pi, charMap: p.charMap || null });
      }
    });
    // Infer timestamps for nosync paras sandwiched between synced ones
    let pi = 0;
    while (pi < paras.length) {
      if (paras[pi].start !== null) { pi++; continue; }
      // Collect contiguous nosync group (skip *** dividers)
      const group = [];
      let j = pi;
      while (j < paras.length && paras[j].start === null) {
        if (paras[j].text.trim() && paras[j].text !== '***') group.push(j);
        j++;
      }
      if (group.length > 0) {
        // Find preceding synced para end
        let prevEnd = null;
        for (let i = pi - 1; i >= 0; i--) {
          if (paras[i].start !== null) { prevEnd = paras[i].end || paras[i].start + 3; break; }
        }
        // Find following synced para start (check next chapter if at end of this one)
        let nextStart = j < paras.length && paras[j].start !== null ? paras[j].start : null;
        if (nextStart === null && ci + 1 < SYNC_DATA.length) {
          const nextChParas = SYNC_DATA[ci + 1].paragraphs;
          const firstSynced = nextChParas.find(p => p.start !== null);
          if (firstSynced) {
            // Cap at announce time of next chapter so inferred paras don't
            // bleed into the next chapter's announce window and flip the subtitle back
            const announceNext = CHAPTER_ANNOUNCE_TIMES[ci + 1] ?? firstSynced.start;
            nextStart = Math.min(firstSynced.start, announceNext);
          }
        }
        if (prevEnd !== null && nextStart !== null) {
          const gap = nextStart - prevEnd;
          if (gap > 0.2 && gap < 40) {
            const slice = gap / (group.length + 1);
            group.forEach((npi, idx) => {
              const s = prevEnd + slice * (idx + 0.5);
              const e = Math.min(s + slice, nextStart - 0.05);
              _flatParas.push({ start: s, end: e, chIdx: ci, ci, pi: npi });
            });
          }
        }
      }
      pi = j;
    }
  });
  _flatParas.sort((a, b) => a.start - b.start);
}
buildFlatParas();

// Assign DOM elements after reader renders
// Fast O(n) para-element linker. Build lookup map keyed by "ci_pi".
// _flatParas entries get a unique ciIdx+paraIdx stored at build time.
function linkParaEls() {
  const strip = document.getElementById('rm-strip');
  if (!strip) return;
  // Query all synced paras once
  const allEls = strip.querySelectorAll('[data-ci][data-pi]');
  const elMap = {};
  allEls.forEach(el => { elMap[el.dataset.ci + '_' + el.dataset.pi] = el; });
  _flatParas.forEach(fp => {
    if (fp.ci !== undefined && fp.pi !== undefined) {
      const key = fp.ci + '_' + fp.pi;
      if (elMap[key]) fp.el = elMap[key];
    }
  });
}

let _lastFlatIdx = -1;
let _autoPageFlip = true;
let _showRemaining = false;
function toggleTimeDisplay() { _showRemaining = !_showRemaining; }

function onTimeUpdate() {
  if (!_hasAudio) return;
  const t = audio.currentTime;
  showTimedBoxes(t);
  const dur = audio.duration || 1;
  const pct = (t / dur) * 100;
  seekbar.value = pct;
  seekbar.style.setProperty('--prog', pct.toFixed(2) + '%');
  tCur.textContent = fmt(t);
  tDur.textContent = _showRemaining ? '-' + fmt(Math.max(0, dur - t)) : fmt(dur);

  // Binary search for active paragraph
  let lo = 0, hi = _flatParas.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (_flatParas[mid].start <= t) { found = mid; lo = mid + 1; }
    else hi = mid - 1;
  }

  if (found >= 0 && _flatParas[found].end >= t) {
    if (found !== _lastFlatIdx) {
      // Remove old active
      if (_lastFlatIdx >= 0 && _flatParas[_lastFlatIdx]?.el) {
        _flatParas[_lastFlatIdx].el.classList.remove('ss-active');
      }
      // Add new active
      const fp = _flatParas[found];
      if (fp.el) {
        fp.el.classList.add('ss-active');
        // Update chapter info
        const chFull = chLabel(fp.chIdx);
        document.getElementById('cur-ch-title').textContent = chShort(fp.chIdx);
        if (fp.chIdx !== _audioSubChIdx) {
          // Only advance — never roll the subtitle backward to an earlier chapter.
          // The announce-time listener may have already moved us forward.
          if (fp.chIdx > _audioSubChIdx || _audioSubChIdx < 0) {
            _audioSubChIdx = fp.chIdx;
            _rmCurrentChIdx = fp.chIdx;
            const sub = document.querySelector('.rm-bar-sub');
            if (sub) sub.textContent = chFull;
          }
        }
        // Flip to correct page, compute col2 boundary once, then draw highlight.
        if (_autoPageFlip) flipAhead(found, t);
        adjustActiveHighlight(fp.el);
        updateSentence(fp, t);
      }
      _lastFlatIdx = found;
    } else {
      updateSentence(_flatParas[found], t);
      // Same paragraph — call every tick so split-page paragraphs advance
      if (_autoPageFlip && _flatParas[found]?.el) {
        flipAhead(found, t);
      }
    }
  } else {
    // Between paragraphs: the next one may start on the next page
    const upcoming = _flatParas[found + 1];
    if (_autoPageFlip && found >= 0 && upcoming && upcoming.chIdx <= Math.max(_audioSubChIdx, _flatParas[found].chIdx)) flipAhead(found, t);
    // In a gap: clear stale highlight — use longer grace at chapter boundaries
    if (_lastFlatIdx >= 0) {
      const lastEnd = _flatParas[_lastFlatIdx]?.end ?? 0;
      const nextChIdx = found >= 0 ? _flatParas[found]?.chIdx : -1;
      const grace = (nextChIdx !== -1 && nextChIdx !== _flatParas[_lastFlatIdx]?.chIdx) ? 60 : 2;
      // A pause before the next piece keeps the highlight. Only a long stretch with nothing to follow clears it.
      const upNext = _flatParas[found + 1];
      const pauseOnly = !!upNext && upNext.start - lastEnd < 20;
      if (t > lastEnd + grace && !pauseOnly) {
        if (_flatParas[_lastFlatIdx]?.el) {
          _flatParas[_lastFlatIdx].el.classList.remove('ss-active');
        }
        const _s = document.getElementById('rm-strip');
        if (_s) _s.querySelectorAll('.ss-hl-frag').forEach(e => e.remove());
        clearSentence();
        _lastFlatIdx = -1;
      }
    }
  }
}

// ── Sentence highlight ──
// A text range from character `from` to `to` of a paragraph, across inline markup
function rangeFromChars(el, from, to) {
  const range = document.createRange();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let chars = 0, n, started = false;
  while ((n = walker.nextNode())) {
    const end = chars + n.length;
    if (!started && from < end) { range.setStart(n, Math.max(0, from - chars)); started = true; }
    if (started && to <= end) { range.setEnd(n, Math.max(0, to - chars)); return range; }
    chars = end;
  }
  return null;
}

// Sentences of a paragraph as [{ from, to, t }], with the time each one starts
function paraSentences(fp) {
  const para = SYNC_DATA[fp.ci].paragraphs[fp.pi];
  if (para._sents) return para._sents;
  const text = para.text, cm = para.charMap || [];
  const starts = [0];
  const boundary = /[.?!]+["'\u2019\u201d)\]]*\s+(?=["'\u2018\u201c(\[\u00bf\u00a1]*[A-Z\u00c0-\u00dc])/g;
  let m;
  while ((m = boundary.exec(text))) starts.push(m.index + m[0].length);
  // A sentence of one or two words rides with the one after it
  const kept = starts.filter((s, i) => i === 0 || text.slice(starts[i - 1], s).trim().split(/\s+/).length > 2);
  para._sents = kept.map((from, i) => {
    const entry = cm.find(c => c[0] >= from);
    return { from, to: i + 1 < kept.length ? kept[i + 1] : text.length, t: i === 0 || !entry ? fp.start : entry[1] };
  });
  return para._sents;
}

let _sentKey = null;
let _sentCur = null;   // { ci, pi, from, to } of the sentence that is lit
// `keepDim` leaves the dimming in place when the next sentence is about to be drawn,
// so the page does not flash back to full strength in between
function clearSentence(keepDim) {
  _sentKey = null;
  _sentCur = null;
  document.querySelectorAll('#rm-strip .ss-lit').forEach(e => e.classList.remove('ss-lit'));
  if (!keepDim) {
    if (window.CSS && CSS.highlights) CSS.highlights.delete('ss-sent');
    document.querySelectorAll('#rm-strip .rm-ch.ss-dim').forEach(e => e.classList.remove('ss-dim'));
  }
  const strip = document.getElementById('rm-strip');
  if (!strip) return;
  strip.querySelectorAll('.ss-sent-frag:not([data-out])').forEach(e => {
    e.dataset.out = '1';
    e.style.opacity = '0';
    setTimeout(() => e.isConnected && e.remove(), 200);
  });
}

// Draws the sentence highlight: one bar per line of text, a little wider than
// the words, with a line down the left of the first one.
// Gap beside the words in px, and how much of a line's height the block gives up at its top and bottom
const SENT_BAR = 0;   // width in px of the line down the left of a sentence, 0 for none
const SENT_PAD = 3.5, SENT_PAD_LEFT = 3.5, SENT_TRIM_TOP = 0.0925, SENT_TRIM_BOTTOM = 0.0925;
function drawSentence(el, range) {
  const strip = document.getElementById('rm-strip');
  if (!strip || !_rmColPitch) return;
  const sRect = strip.getBoundingClientRect();
  const lineH = parseFloat(getComputedStyle(el).lineHeight) || 0;
  const lines = [];
  for (const r of range.getClientRects()) {
    if (r.width < 0.5 || r.height < 1) continue;
    const col = Math.floor((r.left - sRect.left + _rmColGap / 2) / _rmColPitch);
    const mid = (r.top + r.bottom) / 2;
    const line = lines[lines.length - 1];
    if (line && line.col === col && Math.abs(line.mid - mid) < (lineH || r.height) * 0.5) {
      line.left = Math.min(line.left, r.left);
      line.right = Math.max(line.right, r.right);
    } else {
      lines.push({ col, mid, left: r.left, right: r.right, h: r.height });
    }
  }
  // Right edges that nearly line up become one edge, so a hyphen at a line end leaves no notch
  const snap = (parseFloat(getComputedStyle(el).fontSize) || 16) * 0.5;
  for (let pass = 0, moved = true; moved && pass < 8; pass++) {
    moved = false;
    for (let k = 1; k < lines.length; k++) {
      const up = lines[k - 1], down = lines[k];
      if (up.col !== down.col || up.right === down.right || Math.abs(up.right - down.right) >= snap) continue;
      up.right = down.right = Math.max(up.right, down.right);
      moved = true;
    }
  }
  const th = rmGetResolvedTheme();
  const fill = `rgba(${SKIN_DEF.accentRgb},${th.light ? '.17' : '.24'})`;
  // The line down the left runs on while the following lines start at the same edge
  const barred = [];
  lines.forEach((line, k) => {
    barred[k] = k === 0 || (barred[k - 1] && lines[k - 1].col === line.col && Math.abs(lines[k - 1].left - line.left) < 2);
  });
  lines.forEach((line, k) => {
    const first = k === 0, last = k === lines.length - 1;
    // Bars on neighbouring lines meet. Only the top and bottom of the block are trimmed.
    const full = lineH || line.h + 4;
    const above = k > 0 && lines[k - 1].col === line.col ? lines[k - 1] : null;
    const below = !last && lines[k + 1].col === line.col ? lines[k + 1] : null;
    const top = above ? Math.round((above.mid + line.mid) / 2) : line.mid - full / 2 + full * SENT_TRIM_TOP;
    const bottom = below ? Math.round((line.mid + below.mid) / 2) : line.mid + full / 2 - full * SENT_TRIM_BOTTOM;
    const h = bottom - top;
    // A corner is rounded only where no neighbouring bar covers it
    const round = on => on ? '4px' : '0';
    const tl = !above || above.left > line.left + 1, tr = !above || above.right < line.right - 1;
    const br = !below || below.right < line.right - 1, bl = !below || below.left > line.left + 1;
    const bar = barred[k] ? SENT_BAR : 0;
    const box = document.createElement('div');
    box.className = 'ss-sent-frag';
    box.style.cssText = `left:${line.left - sRect.left - SENT_PAD_LEFT - bar}px;top:${top - sRect.top}px;` +
      `width:${line.right - line.left + SENT_PAD + SENT_PAD_LEFT}px;height:${h}px;background:${fill};` +
      `border-left:${bar}px solid ${SKIN_DEF.box.line};` +
      `border-radius:${round(tl)} ${round(tr)} ${round(br)} ${round(bl)};`;
    strip.appendChild(box);
    getComputedStyle(box).opacity;
    box.style.opacity = '1';
  });
}
function updateSentence(fp, t) {
  if (!SENT_MODE || !fp || !fp.el) return;
  const timedPara = typeof fp.pi === 'number' ? SYNC_DATA[fp.ci].paragraphs[fp.pi] : null;
  if (!timedPara || !timedPara.charMap) {
    // A heading, a synopsis line or a paragraph without word times is lit whole, by its box.
    // The rest of the chapter dims around it the same way.
    const wholeKey = fp.ci + ':' + fp.pi;
    if (_sentKey === wholeKey) return;
    const dimsWhole = _rmPrefs.dim !== false;
    clearSentence(dimsWhole);
    if (window.CSS && CSS.highlights) CSS.highlights.delete('ss-sent');
    _sentKey = wholeKey;
    if (dimsWhole) {
      fp.el.classList.add('ss-lit');
      const chapter = fp.el.closest('.rm-ch');
      document.querySelectorAll('#rm-strip .rm-ch.ss-dim').forEach(e => { if (e !== chapter) e.classList.remove('ss-dim'); });
      if (chapter) chapter.classList.add('ss-dim');
    }
    return;
  }
  const sents = paraSentences(fp);
  let k = 0;
  for (let i = 1; i < sents.length; i++) if (sents[i].t <= t) k = i;
  const key = fp.ci + ':' + fp.pi + ':' + k;
  if (key === _sentKey) return;
  _sentKey = key;
  const text = SYNC_DATA[fp.ci].paragraphs[fp.pi].text;
  const to = sents[k].from + text.slice(sents[k].from, sents[k].to).trimEnd().length;
  const range = rangeFromChars(fp.el, sents[k].from, to);
  const dims = !!range && _rmPrefs.dim !== false && typeof Highlight !== 'undefined' && !!(window.CSS && CSS.highlights);
  clearSentence(dims);
  _sentKey = key;
  _sentCur = { ci: fp.ci, pi: fp.pi, from: sents[k].from, to };
  if (dims) {
    CSS.highlights.set('ss-sent', new Highlight(range));   // keeps the sentence at full strength
    const chapter = fp.el.closest('.rm-ch');
    document.querySelectorAll('#rm-strip .rm-ch.ss-dim').forEach(e => { if (e !== chapter) e.classList.remove('ss-dim'); });
    if (chapter) chapter.classList.add('ss-dim');
  }
  if (range) drawSentence(fp.el, range);
}
// Sentence changes are checked every frame while playing, for a crisp hand-over
function sentenceLoop() {
  if (SENT_MODE && _hasAudio && !audio.paused && _lastFlatIdx >= 0) updateSentence(_flatParas[_lastFlatIdx], audio.currentTime);
  requestAnimationFrame(sentenceLoop);
}
requestAnimationFrame(sentenceLoop);

// Draw highlight overlays fitted to actual text bounds per column fragment
let _lastHlPage = -1;

// Boxes that show only while the narrator is in their part of the paragraph
let _hlTimed = [];
function showTimedBoxes(t) {
  for (const box of _hlTimed) {
    const want = t >= box.from && t < box.until;
    if (want === box.shown) continue;
    box.shown = want;
    box.ov.style.transition = 'opacity .28s ease';
    box.ov.style.opacity = want ? '1' : '0';
  }
}

// Time at which the narrator reaches the part of a paragraph that sits in column `col`
function timeAtColumn(el, para, col) {
  const strip = document.getElementById('rm-strip');
  const sLeft = strip.getBoundingClientRect().left;
  const nodes = [];
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let node, len = 0;
  while ((node = walker.nextNode())) { nodes.push([node, len]); len += node.length; }
  const range = document.createRange();

  // Column of the character at `off`, or of the next one that is drawn
  const colAt = off => {
    for (let o = off; o < len; o++) {
      let k = nodes.length - 1;
      while (k > 0 && nodes[k][1] > o) k--;
      range.setStart(nodes[k][0], o - nodes[k][1]);
      range.setEnd(nodes[k][0], o - nodes[k][1] + 1);
      const r = range.getClientRects()[0];
      if (r && r.width > 0) return Math.floor((r.left - sLeft + _rmColGap / 2) / _rmColPitch);
    }
    return Infinity;
  };

  // First character in the column, then the word that holds it
  let lo = 0, hi = Math.max(0, len - 1);
  while (lo < hi) { const mid = (lo + hi) >> 1; if (colAt(mid) >= col) hi = mid; else lo = mid + 1; }
  const cm = para.charMap;
  if (!cm || cm.length < 2) return para.start + (para.end - para.start) * (len ? lo / len : 0);
  let a = 0, b = cm.length - 1;
  while (a < b) { const mid = (a + b + 1) >> 1; if (cm[mid][0] <= lo) a = mid; else b = mid - 1; }
  return cm[a][1];
}

function adjustActiveHighlight(el) {
  _hlTimed = [];
  const strip = document.getElementById('rm-strip');
  if (!strip) return;
  // Fade out old overlays
  strip.querySelectorAll('.ss-hl-frag:not([data-out])').forEach(e => {
    e.dataset.out = '1';
    e.style.transition = 'opacity .22s ease';
    e.style.opacity = '0';
    setTimeout(() => e.isConnected && e.remove(), 250);
  });
  // The sentence highlight replaces the box on paragraphs that have word times
  if (SENT_MODE && el && el.tagName === 'P' && SYNC_DATA[el.dataset.ci]?.paragraphs[el.dataset.pi]?.charMap) return;
  if (!el || !_rmPageW || _rmLayingOut) return;
  const range = document.createRange();
  range.selectNodeContents(el);
  const lineRects = Array.from(range.getClientRects()).filter(r => r.width > 1 && r.height > 1);
  if (!lineRects.length) return;
  const sRect = strip.getBoundingClientRect();
  const cols = new Map();
  lineRects.forEach(r => {
    const col = Math.floor((r.left - sRect.left + _rmColGap / 2) / _rmColPitch);
    if (!cols.has(col)) cols.set(col, []);
    cols.get(col).push(r);
  });
  const BOX = SKIN_DEF.box;
  const PXL = BOX.left, PXR = BOX.right, PY = BOX.y;
  const colList = Array.from(cols.entries());
  const total = colList.length;
  const para = SYNC_DATA[el.dataset.ci] && SYNC_DATA[el.dataset.ci].paragraphs[el.dataset.pi];
  const timed = _hasAudio && para && para.start !== null;
  const spreadOf = c => Math.floor(c / _rmPerPage);
  const colTimes = new Map();
  const colTime = c => { if (!colTimes.has(c)) colTimes.set(c, timeAtColumn(el, para, c)); return colTimes.get(c); };
  colList.forEach(([colNo, rects], idx) => {
    const l = Math.min(...rects.map(r => r.left))  - sRect.left - PXL;
    const t = Math.min(...rects.map(r => r.top))   - sRect.top  - PY;
    const r = Math.max(...rects.map(r => r.right)) - sRect.left + PXR;
    const b = Math.max(...rects.map(r => r.bottom))- sRect.top  + PY;
    const radius = total === 1 ? '9px 0 0 9px'
      : idx === 0           ? '9px 0 0 0'
      : idx === total - 1   ? '0 0 0 9px'
      : '0';
    const ov = document.createElement('div');
    ov.className = 'ss-hl-frag';
    ov.style.cssText = `left:${l}px;top:${t}px;width:${r-l}px;height:${b-t}px;opacity:0;border-radius:${radius};background:${BOX.fill};border-left:3px solid ${BOX.line};`;
    strip.appendChild(ov);
    // With two pages in view, a paragraph split over both is lit only on the page being read
    const before = idx > 0 && spreadOf(colList[idx - 1][0]) === spreadOf(colNo);
    const after  = idx < total - 1 && spreadOf(colList[idx + 1][0]) === spreadOf(colNo);
    if (timed && (before || after)) {
      _hlTimed.push({ ov, from: before ? colTime(colNo) : -Infinity, until: after ? colTime(colList[idx + 1][0]) : Infinity, shown: false });
      return;
    }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ov.style.transition = 'opacity .28s ease';
      ov.style.opacity = '1';
    }));
  });
  if (_hlTimed.length) {
    _hlTimed.forEach(box => getComputedStyle(box.ov).opacity);   // settle the hidden state so the first show fades in
    showTimedBoxes(audio.currentTime);
  }
  _lastHlPage = _rmIdx;
}

// Read-only char position probe using Range — no DOM mutation, no split/rejoin.
// Walks text nodes to find the one containing charOffset, creates a collapsed
// Range at that position, reads its bounding rect. Returns left-in-strip pixels.
function _charLeft(el, strip, charOffset) {
  try {
    const sr = strip.getBoundingClientRect();
    let remaining = charOffset;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) {
      if (remaining <= node.length) {
        const r = document.createRange();
        r.setStart(node, Math.min(remaining, node.length));
        r.collapse(true);
        const rects = r.getClientRects();
        if (rects.length) return rects[0].left - sr.left;
        // fallback: use node rect
        const nr = node.parentElement ? node.parentElement.getBoundingClientRect() : null;
        if (nr) return nr.left - sr.left;
        break;
      }
      remaining -= node.length;
    }
    return el.getBoundingClientRect().left - sr.left;
  } catch(e) { return el.getBoundingClientRect().left - strip.getBoundingClientRect().left; }
}

// Called ONCE (deferred via rAF) when a paragraph first becomes active.
// Uses exact Whisper word timestamps from charMap: walks each [charPos, time]
// entry, measures its page via read-only Range, finds the first word that
// crosses to a new page. Stores fp._col2Time / fp._col2Page so onTimeUpdate
// can do a direct t >= fp._col2Time comparison — zero DOM per tick.
function computeCol2Boundary(el, fp, entryPage) {
  if (fp._col2Done) return;
  fp._col2Done = true;
  if (!_rmPageW || !el) return;
  const strip = document.getElementById('rm-strip');
  if (!strip) return;

    .rm-strip p.ss-epi{font-size:.86em;line-height:1.5;margin-left:10%;margin-right:10%;hyphens:none;-webkit-hyphens:none}
    .rm-strip p.ss-epi.ss-right{margin-top:.25em}
    .rm-strip .ss-break{height:1.5em}
    .rm-strip p.ss-bm::before{left:17px;top:.18em;width:1.1em;height:2px;border-radius:0}
    .rm-strip em{color:inherit}
  `;
  // Bar buttons stay readable on a light page
  if (th.light) css += `
    #rm .rm-bar-actions button{color:${th.text};border-color:rgba(0,0,0,.2)}
  `;
  // While a sentence is lit, the rest of its chapter steps back a little
  if (SENT_MODE && _rmPrefs.dim !== false) css += `
    html:not(.ss-paused) .rm-ch.ss-dim p{color:color-mix(in srgb, ${th.text} 27.5%, ${th.bg});transition:color .2s ease}
    html:not(.ss-paused) .rm-ch.ss-dim p.ss-lit{color:${th.text}}
    html:not(.ss-paused) .rm-ch.ss-dim .bk-num,html:not(.ss-paused) .rm-ch.ss-dim .bk-syn,html:not(.ss-paused) .rm-ch.ss-dim .ss-ch-head:not(.bk-head){opacity:.275;transition:opacity .2s ease}
    html:not(.ss-paused) .rm-ch.ss-dim .bk-num:has(.ss-lit),html:not(.ss-paused) .rm-ch.ss-dim .ss-ch-head:not(.bk-head):has(.ss-lit){opacity:1}
    html:not(.ss-paused) .rm-ch.ss-dim .bk-syn.ss-lit{opacity:.9}
    ::highlight(ss-sent){color:${th.text}}
  `;
  // Extra space after each paragraph, set in the settings panel, in ems
  if (_rmPrefs.ps > 0) css += `
    .rm-strip p{margin-bottom:${(SKIN_DEF.book ? 0 : 0.85) + _rmPrefs.ps}em}
  `;
  return css;
}

function rmSavePrefs() {
  _rmPrefs.t = _rmTheme; _rmPrefs.fs = _rmFontSize;
  try { localStorage.setItem(RM_PREFS_KEY, JSON.stringify(_rmPrefs)); } catch(e) {}
}

function rmPrefersLight() {
  return _rmPrefs.mode === 'light' || (_rmPrefs.mode === 'auto' && !window.matchMedia('(prefers-color-scheme:dark)').matches);
}

function rmGetResolvedTheme(themeName = _rmTheme) {
  const baseTheme = RM_THEMES[themeName] ? themeName : RM_DEFAULTS.t;
  const variant = rmPrefersLight() ? 'light' : 'dark';
  const family = RM_THEMES[baseTheme] || RM_THEMES[RM_DEFAULTS.t];
  return family[variant] || family.dark;
}

// Attributes that tie a heading or synopsis element to its time in the audio.

function timedAttrs(ci, key, timing, cls = '') {
  if (!timing || !_hasAudio) return cls ? `class="${cls}"` : '';

// ── Layout engine (identical to ORV) ──
function rmInit(restorePageIdx) {
  const W = window.innerWidth, H = window.innerHeight;
  const mgPct = (_rmPrefs.mg || 9) / 100;
  const mgPctClamped = Math.min(mgPct, 0.18);
  // Apple Books-style page inset: generous sides, slightly smaller top, roomier bottom.
  const padHBase = Math.round(W * mgPctClamped);
  const padH = Math.max(44, padHBase);
  const padTop = Math.max(64, Math.round(padH * 0.72));
  const padBottom = Math.max(70, Math.round(padH * 0.72));

  const playerEl = document.getElementById('player');
  const playerH = playerEl ? playerEl.getBoundingClientRect().height : 0;

  const topOffset = padTop;
  // Layout ignores player visibility — player overlays on top, doesn't shrink text area
  const playerShown = playerEl && playerEl.classList.contains('visible') && !playerEl.classList.contains('bars-hidden');
  const colH = H - topOffset - Math.max(padBottom, playerShown ? Math.ceil(playerH) + 18 : 0);
  // Still set --player-h for click zone exclusion
  const rmEl = document.getElementById('rm');
  if (rmEl) {
    rmEl.style.setProperty('--player-h', playerH + 'px');
    rmEl.classList.toggle('player-visible', playerEl && playerEl.classList.contains('visible'));
  }

  // Two pages side by side when the setting is on and each page keeps a readable line length
  const sidePad = Math.max(40, Math.round(padH * 0.5));
  const gutter  = Math.max(48, Math.round(W * 0.065));
  const twoColW = Math.floor((W - sidePad * 2 - gutter) / 2);
  const twoUp   = !!_rmPrefs.two && twoColW >= Math.max(260, _rmFontSize * 9);
  const perPage = twoUp ? 2 : 1;
  const colW  = twoUp ? twoColW : W - padH * 2;
  const GAP   = twoUp ? gutter : Math.round(colW * 0.5);
  const clipW = twoUp ? colW * 2 + GAP : colW;
  const clipLeft = twoUp ? Math.round((W - clipW) / 2) : padH;
  const twoHint = document.getElementById('rm-two-hint');
  if (twoHint) twoHint.style.display = _rmPrefs.two && !twoUp ? 'block' : 'none';

  const strip = document.getElementById('rm-strip');
  const clip  = document.getElementById('rm-clip');
  if (!strip || !clip) return;

  clip.style.cssText = `position:absolute;top:${topOffset}px;left:${clipLeft}px;width:${clipW}px;height:${colH}px;overflow:hidden;`;

  const th = rmGetResolvedTheme();
  const fontFam = (_rmPrefs.font || 'Georgia') + ",Georgia,'Times New Roman',serif";

  // Text stays hidden while a new geometry is laid out. A theme change keeps the page in view.
  const laySig = [colW, colH, GAP, perPage, fontFam, _rmFontSize, _rmPrefs.lh, _rmPrefs.ps || 0, _rmPrefs.justify].join('|');
  const sameLayout = laySig === _rmLaySig && _rmPageW > 0 && !_rmLayingOut;
  _rmLaySig = laySig;
  if (!sameLayout) _rmLayingOut = true;
  const layToken = ++_rmLayToken;
  const keepAt = sameLayout && strip.style.transform ? `transform:${strip.style.transform};transition:none;` : 'visibility:hidden;';
  strip.style.cssText = `
    position:absolute;top:0;left:0;
    height:${colH}px;width:${clipW}px;overflow:visible;
    --col-w:${colW}px;--col-h:${colH}px;--col-gap:${GAP}px;
    font-family:${fontFam};font-size:${_rmFontSize}px;color:${th.text};
    line-height:${_rmPrefs.lh || 1.88};letter-spacing:${SKIN_DEF.book ? '0' : '.012em'};
    text-align:${_rmPrefs.justify ? 'justify' : 'left'};
    word-wrap:break-word;overflow-wrap:break-word;
    ${keepAt}
  `;

  let ss = document.getElementById('rm-ss');
  if (!ss) { ss = document.createElement('style'); ss.id = 'rm-ss'; document.head.appendChild(ss); }
  ss.textContent = `
    .rm-strip p{box-sizing:border-box;margin:-.45em 0 .85em;padding:.45em .9em .45em .72em;break-inside:auto;page-break-inside:auto;orphans:1;widows:1;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;}
    .rm-strip p:last-child{margin-bottom:0;}
    .rm-strip p.ss-active{}
    .rm-strip p.para-synced{cursor:pointer;position:relative;z-index:1;}
    .rm-strip p.para-synced.para-click-flash{animation:paraClickFlash .35s ease-out;}
    @keyframes paraClickFlash{0%{opacity:.55}100%{opacity:1}}
  `;
  if (ss) ss.textContent += skinCss();

  requestAnimationFrame(() => requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (layToken !== _rmLayToken) return;   // a newer layout is on its way
      _rmPerPage = perPage;
      _rmColGap = GAP;
      _rmColPitch = colW + GAP;
      _rmPageW = _rmColPitch * perPage;
      _rmTotal = layoutChapters();
      _rmLayingOut = false;

      let target = 0;
      if (restorePageIdx !== undefined) target = restorePageIdx;
      // The page that holds the remembered paragraph, whatever the page count is now
      const anchorEl = _rmAnchor && strip.querySelector(`p[data-ci="${_rmAnchor.ci}"][data-pi="${_rmAnchor.pi}"]`);
      if (anchorEl) target = pageOfEl(anchorEl) + _rmAnchor.d;
      _rmKeepAnchor = !!anchorEl;   // a re-layout must not move the remembered spot
      _rmIdx = Math.max(0, Math.min(_rmTotal - 1, Math.round(target) || 0));
      rmGo(_rmIdx, true);
      _rmKeepAnchor = false;
      strip.style.visibility = '';

      // Re-link para elements after re-layout
      linkParaEls();

      if (_hasAudio && !audio.paused && _autoPageFlip) {
        _rmSnapFollow = true;
        try { onTimeUpdate(); } finally { _rmSnapFollow = false; }
      }

      // The box of the paragraph being read follows the new layout
      const reading = _flatParas[_lastFlatIdx];
      if (reading && reading.el && reading.el.classList.contains('ss-active')) {
        adjustActiveHighlight(reading.el);
        if (SENT_MODE) { clearSentence(); updateSentence(reading, audio.currentTime); }
      }
    });
  }));
}

// Page in view and column where each chapter opens
let _chPage = [], _chCol = [];
let _rmLaySig = '', _rmLayToken = 0, _rmLayingOut = false, _rmSnapFollow = false;

// Measures how many columns each chapter takes and sets the chapters side by side.
// Returns the number of page turns in the book.
function layoutChapters() {
  const boxes = Array.from(document.querySelectorAll('#rm-strip > .rm-ch'));
  const counts = boxes.map(box => {
    const last = box.lastElementChild;
    const rects = last ? last.getClientRects() : [];
    if (!rects.length) return 1;
    const left = rects[rects.length - 1].left - box.getBoundingClientRect().left;
    return Math.max(1, Math.floor((left + 1) / _rmColPitch) + 1);
  });
  _chPage = [];
  _chCol = [];
  let col = 0;
  boxes.forEach((box, k) => {
    box.style.left = col * _rmColPitch + 'px';
    box.dataset.col = col;
    box.dataset.cols = counts[k];
    if (box.dataset.ch !== undefined) {
      _chCol[parseInt(box.dataset.ch)] = col;
      _chPage[parseInt(box.dataset.ch)] = Math.floor(col / _rmPerPage);
    }
    col += counts[k];
  });
  _rmCols = col;
  return Math.max(1, Math.ceil(col / _rmPerPage));
}

// Page number text. Two pages side by side count as one page.
function rmPageLabel(idx) {
  return _rmTotal > 1 ? `${idx + 1} / ${_rmTotal}` : '';
}

// Copy of the reader that shows one page turn's worth of text, for the slide. It holds
// the bars and panels and only the chapters in view there, so it lays out fast.
function cloneReader(rm, pageIdx) {
  const clip = document.getElementById('rm-clip');
  const strip = document.getElementById('rm-strip');
  const copy = rm.cloneNode(false);
  for (const child of rm.children) {
    if (child !== clip) { copy.appendChild(child.cloneNode(true)); continue; }
    const clipCopy = clip.cloneNode(false);
    const stripCopy = strip.cloneNode(false);
    for (const node of strip.children) {
      if (node.classList.contains('rm-ch')) {
        const first = parseInt(node.dataset.col), n = parseInt(node.dataset.cols);
        const from = pageIdx * _rmPerPage;
        if (!(first < from + _rmPerPage && first + n > from)) continue;
      }
      stripCopy.appendChild(node.cloneNode(true));
    }
    // The lit sentence keeps its full strength on the sliding copy too
    if (_sentCur && window.CSS && CSS.highlights && CSS.highlights.has('ss-sent')) {
      const lit = stripCopy.querySelector(`p[data-ci="${_sentCur.ci}"][data-pi="${_sentCur.pi}"]`);
      const litRange = lit && rangeFromChars(lit, _sentCur.from, _sentCur.to);
      if (litRange) CSS.highlights.get('ss-sent').add(litRange);
    }
    clipCopy.appendChild(stripCopy);
    copy.appendChild(clipCopy);
  }
  return copy;
}

function rmGo(idx, instant) {
  const strip = document.getElementById('rm-strip');
  const num   = document.getElementById('rm-num');
  if (!strip || !_rmPageW) return;

  const prevIdx = _rmIdx;

  if (instant) {
    document.querySelectorAll('.rm-turn').forEach(e => e.remove());   // a jump ends any page turn in flight
    _rmIdx = idx;
    strip.style.transition = 'none';
    strip.style.transform  = `translateX(${-idx * _rmPageW}px)`;
  } else {
    const dir = idx > prevIdx ? 1 : -1;
    const made = _makeTurnOverlay(dir, prevIdx, idx);
    _rmIdx = idx;
    if (made) {
      made.overlay.offsetHeight;
      made.overlay.style.transition = 'transform .575s cubic-bezier(.4,0,.2,1)';
      made.lighter.style.transition = 'opacity .575s cubic-bezier(.4,0,.2,1)';
      made.lighter.style.opacity = '0.073';
      if (dir === 1) {
        // Forward: slide current page off to the left
        made.overlay.style.transform = `translateX(${-window.innerWidth}px)`;
        made.overlay.addEventListener('transitionend', e => { if (e.target === made.overlay) made.overlay.remove(); });
      } else {
        // Backward: slide prev page in from the left to cover screen
        made.overlay.style.transform = 'translate3d(0,0,0)';
        made.overlay.addEventListener('transitionend', e => {
          if (e.target !== made.overlay || !made.overlay.isConnected) return;
          if (_rmIdx <= made.nextIdx) strip_snapTo(made.nextIdx);   // a later forward turn has placed the strip
          requestAnimationFrame(() => { made.lighter.remove(); made.overlay.remove(); });
        });
      }
    } else {
      strip.style.transition = 'transform .575s cubic-bezier(.4,0,.2,1)';
      strip.style.transform  = `translateX(${-idx * _rmPageW}px)`;
    }
  }

  if (num) { num.textContent = rmPageLabel(idx); num.style.color = rmGetResolvedTheme().muted; }
  try { localStorage.setItem('ssPageIdx_'+BOOK_ID, idx); } catch(e) {}
  rmRememberAnchor();
  updateBarSubtitle();
  rmRefreshChPages();
}

// The paragraph at the top of the page in view, kept so that a new font, a new
// window size or a late web font brings the reader back to the same text
let _rmAnchor = null, _rmKeepAnchor = false;
try { _rmAnchor = JSON.parse(localStorage.getItem('ssPagePara_'+BOOK_ID) || 'null'); } catch(e) {}
function rmRememberAnchor() {
  if (_rmKeepAnchor) return;
  const els = document.querySelectorAll('#rm-strip p[data-ci]');
  if (!els.length || !_rmPageW) return;
  // First paragraph that starts on this page, or else the one running on from an earlier page
  let lo = 0, hi = els.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (pageOfEl(els[mid]) >= _rmIdx) hi = mid; else lo = mid + 1; }
  let el = els[lo];
  if (pageOfEl(el) > _rmIdx) el = els[lo - 1];
  if (!el) {   // title page, before any paragraph
    _rmAnchor = null;
    try { localStorage.removeItem('ssPagePara_'+BOOK_ID); } catch(e) {}
    return;
  }
  _rmAnchor = { ci: parseInt(el.dataset.ci), pi: parseInt(el.dataset.pi), d: _rmIdx - pageOfEl(el) };
  try { localStorage.setItem('ssPagePara_'+BOOK_ID, JSON.stringify(_rmAnchor)); } catch(e) {}
}

function rmGetPagesLeftInChapter() {
  const strip = document.getElementById('rm-strip');
  if (!strip || !_rmPageW) return null;
  const lastInView = Math.min(_rmCols, (_rmIdx + 1) * _rmPerPage) - 1;
  let nextChCol = _rmCols;
  _chCol.forEach(col => { if (col > lastInView && col < nextChCol) nextChCol = col; });
  return Math.floor((nextChCol - 1) / _rmPerPage) - _rmIdx;   // page turns until the chapter's last page
}

function rmGetTimeLeftInChapter() {
  if (!audio || audio.paused || _lastFlatIdx < 0) return null;
  const chIdx = _flatParas[_lastFlatIdx]?.chIdx;
  if (chIdx == null || chIdx < 0) return null;
  const chParas = SYNC_DATA[chIdx]?.paragraphs;
  if (!chParas) return null;
  let lastEnd = null;
  for (const p of chParas) {
    if (p.end != null) lastEnd = p.end;
  }
  if (lastEnd === null) return null;
  const remaining = lastEnd - audio.currentTime;
  return remaining > 0 ? remaining : null;
}

let _chPagesLocked = false, _chPagesHoverTimer = null;
function rmRefreshChPages() {
  const el = document.getElementById('rm-ch-pages');
  if (!el) return;
  el.style.color = rmGetResolvedTheme().muted;

  const n = rmGetPagesLeftInChapter();
  const pagesLine = n === null ? '' : n === 0 ? 'last page of chapter' : `${n} page${n === 1 ? '' : 's'} left`;

  const secs = rmGetTimeLeftInChapter();
  let timeLine = '';
  if (secs !== null) {
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    timeLine = m > 0 ? `${m}m ${s}s left in chapter` : `${s}s left in chapter`;
  }

  if (pagesLine && timeLine) {
    el.innerHTML = `${pagesLine}<br>${timeLine}`;
  } else {
    el.textContent = pagesLine || timeLine || '';
  }
}

}

function updateBarSubtitle() {
  const strip = document.getElementById('rm-strip');
  if (!strip || !_rmPageW) return;
  // Chapter that the page in view belongs to
  let best = -1;
  _chPage.forEach((page, k) => { if (page <= _rmIdx && (best < 0 || page >= _chPage[best])) best = k; });
  if (best >= 0) {
    const ci = best;
    _rmCurrentChIdx = ci;
    const sub = document.querySelector('.rm-bar-sub');
    // Only update subtitle text from page position when audio isn't driving it

function rmFlip(dir) {

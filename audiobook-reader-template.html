// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (!document.getElementById('rm')) return;
  if (e.metaKey && e.code === 'KeyK') {
    e.preventDefault();
    document.getElementById('rm-search')?.classList.contains('show') ? rmSearchClose() : rmSearchOpen();
    return;
  }
  const searchOpen = document.getElementById('rm-search')?.classList.contains('show');
  if (e.key === 'Escape') {
    if (searchOpen) { rmSearchClose(); return; }
    if (document.getElementById('sleep-menu').classList.contains('show')) { sleepCloseMenu(); return; }
    const toc = document.getElementById('rm-toc');
    if (toc && toc.classList.contains('show')) { toc.classList.remove('show'); return; }
    const cfg = document.getElementById('rm-cfg');
    if (cfg && cfg.classList.contains('show')) { cfg.classList.remove('show'); return; }
    rmClose();
  }
  if (searchOpen) return; // let search input handle all other keys
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  { e.preventDefault(); rmFlipUser(1);  }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); rmFlipUser(-1); }
  if (e.key === ' ') { e.preventDefault(); rmFlipUser(1); }
  if (e.key === 'Alt') { e.preventDefault(); if (_hasAudio) togglePlay(); }
  if ((e.key === '.' || e.key === '>') && _hasAudio) { e.preventDefault(); skipSentence(1); }
  if ((e.key === ',' || e.key === '<') && _hasAudio) { e.preventDefault(); skipSentence(-1); }
  if (e.key === 'h' || e.key === 'H') rmToggleBar();
  if (e.key === 'l' || e.key === 'L') rmToggleChPages();

  if ((e.key === 'p' || e.key === 'P') && _hasAudio) togglePlay();
  if ((e.key === 'b' || e.key === 'B') && !e.metaKey && !e.ctrlKey) bmAdd();
  if (e.ctrlKey && e.key === 'ArrowRight') { e.preventDefault(); jumpToChapter(Math.min(_rmCurrentChIdx + 1, SYNC_DATA.length - 1)); }
  if (e.ctrlKey && e.key === 'ArrowLeft')  { e.preventDefault(); jumpToChapter(Math.max(_rmCurrentChIdx - 1, 0)); }
  if ((e.key === ']' || e.key === '=') && _hasAudio) { e.preventDefault(); speedUp(); }
  if ((e.key === '[' || e.key === '-') && _hasAudio) { e.preventDefault(); speedDown(); }
  if ((e.key === 'd' || e.key === 'D') && _hasAudio) { e.preventDefault(); setSpeed(1); } // 1 = index of 1× in _speeds
});

// ── Search ──
let _searchMatches = [], _searchIdx = 0, _searchWasPlaying = false;

function rmSearchOpen() {
  const panel = document.getElementById('rm-search');
  if (!panel) return;
  _searchWasPlaying = _hasAudio && !audio.paused;
  if (_searchWasPlaying) audio.pause();
  panel.classList.add('show');
  const input = document.getElementById('rm-search-input');
  input.focus();
  input.select();
}

function rmSearchClose() {
  const panel = document.getElementById('rm-search');
  if (!panel) return;
  panel.classList.remove('show');
  rmSearchClear();
  document.getElementById('rm-search-input').value = '';
  if (_searchWasPlaying && _hasAudio) { audio.play(); _searchWasPlaying = false; }
}

function rmSearchClear() {
  _sentKey = null;   // search marks split text nodes, so the sentence range is rebuilt
  document.querySelectorAll('.rm-search-mark').forEach(m => {
    m.replaceWith(document.createTextNode(m.textContent));
  });
  document.getElementById('rm-strip')?.normalize();
  _searchMatches = []; _searchIdx = 0;
  const c = document.getElementById('rm-search-count');
  if (c) c.textContent = '';
}

function rmSearchRun(query) {
  rmSearchClear();
  if (!query || !query.trim()) return;
  const strip = document.getElementById('rm-strip');
  if (!strip) return;
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const walker = document.createTreeWalker(strip, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n; while ((n = walker.nextNode())) nodes.push(n);
  nodes.forEach(tn => {
    if (!re.test(tn.textContent)) { re.lastIndex = 0; return; }
    re.lastIndex = 0;
    const text = tn.textContent, frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'rm-search-mark';
      mark.textContent = m[0];
      frag.appendChild(mark);
      _searchMatches.push(mark);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  });
  if (_searchMatches.length) { _searchIdx = 0; rmSearchFocus(0); }
  rmSearchUpdateCount();
}

function rmSearchFocus(idx) {
  _searchMatches.forEach((m, i) => m.classList.toggle('rm-search-mark-active', i === idx));
  const mark = _searchMatches[idx];
  if (!mark || !_rmPageW) return;
  const strip = document.getElementById('rm-strip');
  if (!strip) return;
  const page = Math.max(0, Math.min(_rmTotal - 1,
    Math.floor((mark.getBoundingClientRect().left - strip.getBoundingClientRect().left) / _rmPageW)
  ));
  if (page !== _rmIdx) {
    _rmIdx = page;
    strip_snapTo(page);
    updateBarSubtitle();
    const numEl = document.getElementById('rm-num');
    if (numEl) numEl.textContent = rmPageLabel(page);
  }
}

function rmSearchNav(dir) {
  if (!_searchMatches.length) return;
  _searchIdx = (_searchIdx + dir + _searchMatches.length) % _searchMatches.length;
  rmSearchFocus(_searchIdx);
  rmSearchUpdateCount();
}

function rmSearchUpdateCount() {
  const el = document.getElementById('rm-search-count');
  if (!el) return;
  const q = document.getElementById('rm-search-input')?.value;
  el.textContent = _searchMatches.length ? `${_searchIdx + 1}/${_searchMatches.length}` : (q ? 'no results' : '');
}

function rmSearchKey(e) {
  if (e.key === 'Enter')  { e.preventDefault(); rmSearchNav(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { e.preventDefault(); rmSearchClose(); }
}

// ── Interactive drag-to-turn (touch + trackpad) ──
let _drag = null; // { dir, startX, overlay, committed }

function _dragStart(clientX, clientY) {
  if (!document.getElementById('rm')) return;
  if (document.querySelector('.rm-cfg.show,.rm-toc.show')) return;
  if (_rmUserFlipping || _rmLayingOut) return;
  _drag = { startX: clientX, startY: clientY, dir: 0, overlay: null, committed: false, moved: false, t: Date.now() };
}

function _dragMove(clientX) {
  if (!_drag) return;
  const dx = clientX - _drag.startX;
  if (!_drag.moved && Math.abs(dx) < 8) return;
  _drag.moved = true;

  // Determine direction on first significant move
  if (!_drag.dir) {
    _drag.dir = dx < 0 ? 1 : -1; // 1=forward, -1=back
    const nextIdx = _rmIdx + _drag.dir;
    if (nextIdx < 0 || nextIdx >= _rmTotal) { _drag = null; return; }

    // Clone full #rm as overlay (includes bars, content, page number)
    const rm = document.getElementById('rm');
    const bg = rmGetResolvedTheme().bg || '#0d0d0d';
    const ov = cloneReader(rm, _drag.dir === 1 ? _rmIdx : nextIdx);
    ov.removeAttribute('id');
    ov.style.cssText = `position:fixed;inset:0;z-index:150;background:${bg};overflow:hidden;pointer-events:none;animation:none;will-change:transform;`;
    const ob2 = ov.querySelector('.rm-bar');
    if (ob2) {
      ob2.style.position = 'absolute';
      ob2.style.transition = 'none';
      if (rm.classList.contains('bar-hidden')) {
        ob2.style.opacity = '0';
        ob2.style.transform = 'translateY(-100%)';
        ob2.style.pointerEvents = 'none';
      }
    }
    const sc2 = ov.querySelector('#rm-strip');
    const pageIdx2 = _drag.dir === 1 ? _rmIdx : nextIdx;
    if (sc2) { sc2.removeAttribute('id'); sc2.style.transform=`translateX(${-pageIdx2*_rmPageW}px)`; sc2.style.transition='none'; }
    ov.querySelectorAll('[style*="position: fixed"],[style*="position:fixed"]').forEach(el => {
      if (!el.closest('#rm-clip') && !el.classList.contains('rm-bar') && !el.classList.contains('rm-num')) el.remove();
    });
    const lighter = document.createElement('div');
    lighter.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;transition:none;';
    if (_drag.dir === 1) {
      // Forward: overlay = current page at 0, lighter on overlay, snap strip to next
      ov.style.transform = 'translate3d(0,0,0)';
      ov.appendChild(lighter);
      document.body.appendChild(ov);
      strip_snapTo(nextIdx);
    } else {
      // Backward: overlay = prev page starting off-screen left, lighter on #rm
      ov.style.transform = `translate3d(${-window.innerWidth}px,0,0)`;
      rm.appendChild(lighter);
      document.body.appendChild(ov);
      // strip stays at current page
    }
    _drag.overlay = ov;
    _drag.lighter = lighter;
  }

  if (!_drag.overlay) return;
  const dx2 = clientX - _drag.startX;
  const W2 = window.innerWidth;
  let overlayX, lighterOpacity;
  if (_drag.dir === 1) {
    // Forward: overlay slides left from 0
    overlayX = Math.max(-W2, Math.min(0, dx2));
    lighterOpacity = (Math.abs(overlayX) / W2 * 0.073).toFixed(3);
  } else {
    // Backward: overlay slides in from -W toward 0
    overlayX = Math.max(-W2, Math.min(0, dx2 - W2));
    lighterOpacity = ((1 - Math.abs(overlayX) / W2) * 0.073).toFixed(3);
  }
  _drag.overlay.style.transition = 'none';
  _drag.overlay.style.transform  = `translateX(${overlayX}px)`;
  if (_drag.lighter) _drag.lighter.style.opacity = lighterOpacity;
  _drag.lastX = clientX;
  _drag.lastT = Date.now();
}

function strip_snapTo(idx) {
  const s = document.getElementById('rm-strip');
  if (s && _rmPageW) { s.style.transition='none'; s.style.transform=`translateX(${-idx*_rmPageW}px)`; }
}

function _dragEnd(clientX) {
  if (!_drag || !_drag.moved || !_drag.overlay) {
    // Tap — handle click-to-play if tiny movement
    if (_drag && !_drag.moved) {
      _drag = null;
      return;
    }
    _drag = null; return;
  }
  const dx      = clientX - _drag.startX;
  const dt      = Date.now() - (_drag.lastT || _drag.t);
  const vx      = dt > 0 ? Math.abs(clientX - (_drag.lastX || _drag.startX)) / dt : 0;
  const W       = window.innerWidth;
  const past50  = Math.abs(dx) > W * 0.35;
  const fast    = vx > 0.4;
  const correct = (_drag.dir === 1 && dx < 0) || (_drag.dir === -1 && dx > 0);
  const commit  = correct && (past50 || fast);

  const ov = _drag.overlay;
  const dir = _drag.dir;
  const nextIdx = _rmIdx + dir;

  const commitTarget = dir === 1 ? -W : 0;
  const cancelTarget = dir === 1 ? 0 : -W;
  const lighter = _drag.lighter;

  if (commit) {
    const remaining = Math.max(0, W - Math.abs(dx));
    const ms = Math.max(164, Math.min(589, Math.round((remaining / W) * 589)));
    ov.style.transition = `transform ${ms}ms cubic-bezier(.4,0,.2,1)`;
    ov.style.transform  = `translateX(${commitTarget}px)`;
    if (lighter) { lighter.style.transition = `opacity ${ms}ms cubic-bezier(.4,0,.2,1)`; lighter.style.opacity = '0.073'; }
    _rmUserFlipping = true; _rmAnimating = true;
    holdFollow();
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      if (dir === -1) { strip_snapTo(nextIdx); requestAnimationFrame(() => { lighter && lighter.remove(); ov.remove(); }); }
      else { ov.remove(); }
      _rmIdx = nextIdx;
      try { localStorage.setItem('ssPageIdx_'+BOOK_ID, _rmIdx); } catch(e) {}
      updateBarSubtitle();
      const numEl = document.getElementById('rm-num');
      if (numEl) { numEl.textContent = rmPageLabel(_rmIdx); numEl.style.color=rmGetResolvedTheme().muted; }
      _rmUserFlipping = false; _rmAnimating = false;
    };
    ov.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, ms + 80);
  } else {
    if (dir === 1) strip_snapTo(_rmIdx);
    const ms = Math.max(131, Math.min(362, Math.round((Math.abs(dx) / W) * 407)));
    ov.style.transition = `transform ${ms}ms cubic-bezier(.4,0,.2,1)`;
    ov.style.transform  = `translateX(${cancelTarget}px)`;
    if (lighter) { lighter.style.transition = `opacity ${ms}ms cubic-bezier(.4,0,.2,1)`; lighter.style.opacity = '0'; }
    const cleanup = () => { if (dir === -1 && lighter) lighter.remove(); ov.remove(); };
    ov.addEventListener('transitionend', cleanup, { once: true });
    setTimeout(cleanup, ms + 80);
  }
  _drag = null;
}

// Touch events
document.addEventListener('touchstart', e => {
  _dragStart(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (_drag && _drag.moved) e.preventDefault();
  _dragMove(e.touches[0].clientX);
}, {passive:false});
document.addEventListener('touchend', e => {
  const cx = e.changedTouches[0].clientX;
  const cy = e.changedTouches[0].clientY;
  if (_drag && !_drag.moved) {
    // Tap detection
    _drag = null;
    if (document.querySelector('.rm-bar,.rm-cfg,.rm-toc')) return;
    const W2 = window.innerWidth;
    if (cx > W2*0.3 && cx < W2*0.7 && _hasAudio) togglePlay();
    return;
  }
  _dragEnd(cx);
}, {passive:true});

// Long-press / drag detection for Mac Look Up / text selection
let _lpFlag = false, _lpTimer = null, _lpDownX = 0, _lpDownY = 0, _lpWasDrag = false;
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#rm-strip p, #rm-strip .ss-timed')) return;
  _lpFlag = false;
  _lpWasDrag = false;
  _lpDownX = e.clientX;
  _lpDownY = e.clientY;
  _lpTimer = setTimeout(() => { _lpFlag = true; }, 400);
}, true);
document.addEventListener('mouseup', e => {
  clearTimeout(_lpTimer);
  _lpTimer = null;
  const dx = e.clientX - _lpDownX, dy = e.clientY - _lpDownY;
  if (Math.sqrt(dx*dx + dy*dy) > 6) _lpWasDrag = true;
  setTimeout(() => { _lpFlag = false; _lpWasDrag = false; }, 50);
}, true);

// Character offset inside paragraph `el` at a screen point, or -1
function charOffsetAtPoint(el, x, y) {
  let node = null, offset = 0;
  if (document.caretPositionFromPoint) {
    const pos = document.caretPositionFromPoint(x, y);
    if (pos) { node = pos.offsetNode; offset = pos.offset; }
  } else if (document.caretRangeFromPoint) {
    const range = document.caretRangeFromPoint(x, y);
    if (range) { node = range.startContainer; offset = range.startOffset; }
  }
  if (!node || node.nodeType !== Node.TEXT_NODE || !el.contains(node)) return -1;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let chars = 0, n;
  while ((n = walker.nextNode())) {
    if (n === node) return chars + offset;
    chars += n.length;
  }
  return -1;
}

// The word under a tap: { t, from, to } with its audio time and character range, or null
function wordAtPoint(el, x, y) {
  const ci = parseInt(el.dataset.ci), pi = parseInt(el.dataset.pi);
  const para = el.dataset.pi === 's' ? { text: SYNC_DATA[ci].synopsis, charMap: SYNC_DATA[ci].syn.charMap } : SYNC_DATA[ci]?.paragraphs[pi];
  const cm = para?.charMap;
  if (!cm || !cm.length) return null;
  const at = charOffsetAtPoint(el, x, y);
  if (at < 0) return null;
  let lo = 0, hi = cm.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (cm[mid][0] <= at) lo = mid; else hi = mid - 1; }
  const to = lo + 1 < cm.length ? cm[lo + 1][0] : para.text.length;
  return { t: cm[lo][1], from: cm[lo][0], to };
}

// Brief marker over characters from..to of a paragraph
function flashWord(el, from, to) {
  const strip = document.getElementById('rm-strip');
  if (!strip) return;
  const range = document.createRange();
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let chars = 0, n, started = false;
  while ((n = walker.nextNode())) {
    const end = chars + n.length;
    if (!started && from < end) { range.setStart(n, Math.max(0, from - chars)); started = true; }
    if (started && to <= end) { range.setEnd(n, Math.max(0, to - chars)); break; }
    chars = end;
  }
  if (!started || range.collapsed) return;
  const sRect = strip.getBoundingClientRect();
  for (const r of range.getClientRects()) {
    if (r.width < 2) continue;
    const mark = document.createElement('div');
    mark.className = 'ss-word-flash';
    mark.style.cssText = `left:${r.left - sRect.left - 2}px;top:${r.top - sRect.top}px;width:${r.width + 4}px;height:${r.height}px;`;
    strip.appendChild(mark);
    mark.addEventListener('animationend', () => mark.remove(), { once: true });
  }
}

// Tap on a paragraph: play from the tapped word, or from the paragraph start
function rmParaClick(t, ev) {
  if (_lpFlag || _lpWasDrag) return;
  ev = ev || window.event;
  const el = ev?.target?.closest('p, .ss-timed');
  const word = el && ev ? wordAtPoint(el, ev.clientX, ev.clientY) : null;
  if (word) {
    // Start a touch early so the first sound of the word is not clipped
    audio.currentTime = Math.max(t, word.t - 0.08);
    flashWord(el, word.from, word.to);
  } else {
    audio.currentTime = t;
    if (el) { el.classList.remove('para-click-flash'); void el.offsetWidth; el.classList.add('para-click-flash'); el.addEventListener('animationend', () => el.classList.remove('para-click-flash'), { once: true }); }
  }
  if (audio.paused) audio.play();
}

// Show pages-left when cursor enters lower 22% of reader
document.addEventListener('mousemove', e => {
  if (!document.getElementById('rm-clip')) return;
  if (e.clientY > window.innerHeight * 0.78) {
    rmShowChPages(true);
  }
});

// Trackpad: pointer events for drag (only on non-touch)
let _ptrDragging = false;
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return; // handled by touch events
  if (e.pointerType === 'mouse' && e.buttons !== 1) return; // only left-click drag
  if (e.target.closest('#rm-strip p, #rm-strip .ss-timed')) return; // allow text selection on paragraphs
  _dragStart(e.clientX, e.clientY);
  _ptrDragging = true;
});
document.addEventListener('pointermove', e => {
  if (!_ptrDragging || e.pointerType === 'touch') return;
  _dragMove(e.clientX);
});
document.addEventListener('pointerup', e => {
  if (!_ptrDragging || e.pointerType === 'touch') return;
  _ptrDragging = false;
  _dragEnd(e.clientX);
});

// ── Scroll wheel / trackpad page-turn ──
let _wheelAccum = 0, _wheelResetTimer = null, _wheelDrainUntil = 0;

function _makeTurnOverlay(dir, fromIdx = _rmIdx, nextIdx = fromIdx + dir) {
  if (nextIdx < 0 || nextIdx >= _rmTotal) return null;

  const rm = document.getElementById('rm');
  if (!rm || !_rmPageW) return null;

  const bg = rmGetResolvedTheme().bg || '#0d0d0d';
  const W = window.innerWidth;
  // Forward: overlay = current page (fromIdx), starts on-screen, slides left
  // Backward: overlay = prev page (nextIdx), starts off-screen left, slides in
  const pageIdx = dir === 1 ? fromIdx : nextIdx;
  const startX  = dir === 1 ? 0 : -W;

  const ov = cloneReader(rm, pageIdx);
  ov.removeAttribute('id');
  ov.style.cssText = `position:fixed;inset:0;z-index:150;background:${bg};overflow:hidden;pointer-events:none;animation:none;will-change:transform;transform:translate3d(${startX}px,0,0);backface-visibility:hidden;`;

  const ob = ov.querySelector('.rm-bar');
  if (ob) {
    ob.style.position = 'absolute';
    ob.style.transition = 'none';
    if (rm.classList.contains('bar-hidden')) {
      ob.style.opacity = '0';
      ob.style.transform = 'translateY(-100%)';
      ob.style.pointerEvents = 'none';
    }
  }

  const sc = ov.querySelector('#rm-strip');
  if (sc) {
    sc.removeAttribute('id');
    sc.style.transform = `translateX(${-pageIdx * _rmPageW}px)`;
    sc.style.transition = 'none';
  }

  ov.querySelectorAll('[style*="position: fixed"],[style*="position:fixed"]').forEach(el => {
    if (!el.closest('#rm-clip') && !el.classList.contains('rm-bar') && !el.classList.contains('rm-num')) el.remove();
  });

  const lighter = document.createElement('div');
  lighter.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;transition:none;';

  if (dir === 1) {
    // Forward: lighter on overlay (current page leaving)
    ov.appendChild(lighter);
    document.body.appendChild(ov);
    strip_snapTo(nextIdx);
  } else {
    // Backward: lighter on underlying #rm (current page being covered)
    rm.appendChild(lighter);
    document.body.appendChild(ov);
    // strip stays at current page during animation — snapped after
  }

  ov.classList.add('rm-turn');
  lighter.classList.add('rm-turn');
  return { overlay: ov, nextIdx, lighter, dir };
}

document.addEventListener('wheel', e => {
  if (!document.getElementById('rm')) return;
  if (document.querySelector('.rm-cfg.show,.rm-toc.show')) return;
  e.preventDefault();

  const raw = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(raw) < 1) return;

  // Drain momentum events while flipping or during post-flip drain window
  if (_rmUserFlipping || Date.now() < _wheelDrainUntil) { _wheelAccum = 0; return; }

  if ((raw > 0 && _wheelAccum < 0) || (raw < 0 && _wheelAccum > 0)) _wheelAccum = 0;
  _wheelAccum += raw;

  clearTimeout(_wheelResetTimer);
  _wheelResetTimer = setTimeout(() => { _wheelAccum = 0; }, 400);

  if (Math.abs(_wheelAccum) > 120) {
    const dir = _wheelAccum > 0 ? 1 : -1;
    _wheelAccum = 0;
    _wheelDrainUntil = Date.now() + 1100;
    clearTimeout(_wheelResetTimer);
    rmFlipUser(dir);
  }
}, { passive: false });

// ── Resize ──
let _rmResizeTimer = null;
function _rmOnResize() {
  if (!document.getElementById('rm')) return;
  clearTimeout(_rmResizeTimer);
  _rmResizeTimer = setTimeout(() => rmInit(_rmIdx), 150);
}
window.addEventListener('resize', _rmOnResize);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', _rmOnResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', _rmOnResize);

// ═══════════════════════════════════════════════════════════════
//  FILE LOADING
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════
//  PERSISTENCE  (IndexedDB file handle + localStorage position)
// ═══════════════════════════════════════════════════════════════

const SS_DB_NAME = 'ssReaderDB', SS_DB_VER = 1, SS_STORE = 'session';

function ssOpenDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(SS_DB_NAME, SS_DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(SS_STORE);
    req.onsuccess = e => res(e.target.result);
    req.onerror = () => rej(req.error);
  });
}
async function ssDBGet(key) {
  const db = await ssOpenDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(SS_STORE, 'readonly');
    const req = tx.objectStore(SS_STORE).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function ssDBSet(key, val) {
  const db = await ssOpenDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(SS_STORE, 'readwrite');
    tx.objectStore(SS_STORE).put(val, key);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}
async function ssDBDel(key) {
  const db = await ssOpenDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(SS_STORE, 'readwrite');
    tx.objectStore(SS_STORE).delete(key);
    tx.oncomplete = res;
    tx.onerror = () => rej(tx.error);
  });
}

// Audio position is saved every 3 seconds, on pause, and when the page closes
function saveAudioPos() {
  if (_hasAudio && !isNaN(audio.currentTime) && audio.currentTime > 0) {
    try { localStorage.setItem('ssAudioPos_'+BOOK_ID, audio.currentTime.toFixed(2)); } catch(e) {}
  }
}
let _posInterval = null;
function startPosSave() {
  if (_posInterval) return;
  _posInterval = setInterval(saveAudioPos, 3000);
}
window.addEventListener('pagehide', saveAudioPos);

// ═══════════════════════════════════════════════════════════════
//  CHAPTER TIMES
// ═══════════════════════════════════════════════════════════════

// Audio time where each chapter begins, or null for a chapter with no synced text
const CH_STARTS = SYNC_DATA.map((ch, ci) => {
  if (CHAPTER_ANNOUNCE_TIMES.length === SYNC_DATA.length) return CHAPTER_ANNOUNCE_TIMES[ci];
  const first = ch.paragraphs.find(p => p.start !== null);
  return first ? first.start : null;
});

// Marks on the seek bar where each chapter starts
function buildSeekTicks() {
  const box = document.getElementById('seek-ticks');
  const dur = audio.duration;
  if (!box || !dur || !isFinite(dur)) return;
  box.innerHTML = CH_STARTS.map(s => s !== null && s / dur > 0.004 && s < dur
    ? `<span class="seek-tick" style="left:${(s / dur * 100).toFixed(3)}%"></span>` : '').join('');
}
audio.addEventListener('loadedmetadata', buildSeekTicks);
audio.addEventListener('durationchange', buildSeekTicks);

function chapterAtTime(t) {
  let ci = 0;
  CH_STARTS.forEach((s, i) => { if (s !== null && s <= t) ci = i; });
  return ci;
}

function chapterEndTime(t) {
  const next = CH_STARTS.find(s => s !== null && s > t + 0.5);
  return next !== undefined ? next : (audio.duration || Infinity);
}

// ═══════════════════════════════════════════════════════════════
//  MEDIA KEYS  (keyboard play/pause, next, previous, lock screen)
// ═══════════════════════════════════════════════════════════════

let _mediaCh = -1;
function mediaUpdate() {
  if (!('mediaSession' in navigator) || !_hasAudio) return;
  const ci = chapterAtTime(audio.currentTime);
  if (ci !== _mediaCh) {
    _mediaCh = ci;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: chLabel(ci), artist: BOOK_AUTHOR || BOOK_TITLE, album: BOOK_TITLE
    });
  }
  if (audio.duration && isFinite(audio.duration)) {
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration, playbackRate: audio.playbackRate || 1,
        position: Math.min(audio.currentTime, audio.duration)
      });
    } catch(e) {}
  }
}

if ('mediaSession' in navigator) {
  const on = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch(e) {} };
  on('play',  () => audio.play());
  on('pause', () => audio.pause());
  on('seekbackward', d => skip(-(d.seekOffset || 30)));
  on('seekforward',  d => skip(d.seekOffset || 30));
  on('seekto', d => { audio.currentTime = d.seekTime; });
  on('nexttrack', () => jumpToChapter(Math.min(chapterAtTime(audio.currentTime) + 1, SYNC_DATA.length - 1)));
  on('previoustrack', () => {
    // Back to the top of this chapter first, then to the one before
    const ci = chapterAtTime(audio.currentTime);
    const into = audio.currentTime - (CH_STARTS[ci] || 0);
    jumpToChapter(into > 8 ? ci : Math.max(ci - 1, 0));
  });
  ['play', 'pause', 'seeked', 'ratechange', 'loadedmetadata'].forEach(ev => audio.addEventListener(ev, mediaUpdate));
  audio.addEventListener('timeupdate', () => { if (chapterAtTime(audio.currentTime) !== _mediaCh) mediaUpdate(); });
}

// ═══════════════════════════════════════════════════════════════
//  SLEEP TIMER
// ═══════════════════════════════════════════════════════════════

const SLEEP_FADE = 6;   // seconds of fade-out before the pause
let _sleep = { mode: 'off', endAt: 0, chEnd: 0, fading: false, vol: 1, tick: null };

function sleepToggleMenu(ev) {
  ev?.stopPropagation();
  document.getElementById('sleep-menu').classList.toggle('show');
}
function sleepCloseMenu() {
  document.getElementById('sleep-menu').classList.remove('show');
}
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.sleep-wrap')) sleepCloseMenu();
});

function sleepSet(choice) {
  sleepCloseMenu();
  sleepRestoreVolume();
  clearInterval(_sleep.tick);
  _sleep.mode = choice === 'off' ? 'off' : choice === 'chapter' ? 'chapter' : 'time';
  if (_sleep.mode === 'time') _sleep.endAt = Date.now() + choice * 60000;
  if (_sleep.mode === 'chapter') _sleep.chEnd = chapterEndTime(audio.currentTime);
  document.querySelectorAll('#sleep-menu button').forEach(b =>
    b.classList.toggle('on', b.dataset.sleep === String(choice) && choice !== 'off'));
  _sleep.tick = _sleep.mode === 'off' ? null : setInterval(sleepTick, 250);
  sleepTick();
}

function sleepSecondsLeft() {
  if (_sleep.mode === 'time') return (_sleep.endAt - Date.now()) / 1000;
  // Stops a moment before the next chapter is announced
  return (_sleep.chEnd - 0.4 - audio.currentTime) / (audio.playbackRate || 1);
}

function sleepRestoreVolume() {
  if (!_sleep.fading) return;
  audio.volume = _sleep.vol;
  _sleep.fading = false;
}

function sleepTick() {
  const btn = document.getElementById('sleep-btn');
  if (_sleep.mode === 'off') {
    btn.textContent = 'Zz';
    btn.classList.remove('active');
    return;
  }
  const left = sleepSecondsLeft();
  btn.classList.add('active');
  btn.textContent = 'Zz ' + fmt(Math.max(0, Math.ceil(left)));

  if (left <= 0) {
    audio.pause();
    sleepRestoreVolume();
    sleepSet('off');
  } else if (left < SLEEP_FADE && !audio.paused) {
    if (!_sleep.fading) { _sleep.fading = true; _sleep.vol = audio.volume; }
    audio.volume = _sleep.vol * (left / SLEEP_FADE);
  } else {
    sleepRestoreVolume();
  }
}

// A seek while waiting for the chapter to end moves the target to the new chapter
audio.addEventListener('seeked', () => {
  if (_sleep.mode === 'chapter') { sleepRestoreVolume(); _sleep.chEnd = chapterEndTime(audio.currentTime); }
});

// ═══════════════════════════════════════════════════════════════
//  BOOKMARKS
// ═══════════════════════════════════════════════════════════════

let _bookmarks = [];   // { id, ci, pi, t, text }
try { _bookmarks = JSON.parse(localStorage.getItem('ssBookmarks_'+BOOK_ID) || '[]'); } catch(e) {}

function bmSave() {
  try { localStorage.setItem('ssBookmarks_'+BOOK_ID, JSON.stringify(_bookmarks)); } catch(e) {}
}

function pageOfEl(el) {
  const strip = document.getElementById('rm-strip');
  const rect = el.getClientRects()[0];
  if (!strip || !rect || !_rmPageW) return 0;
  return Math.floor((rect.left - strip.getBoundingClientRect().left + 1) / _rmPageW);
}

// First paragraph that starts on the page in view
function firstParaOnPage() {
  const els = document.querySelectorAll('#rm-strip p[data-ci]');
  let lo = 0, hi = els.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (pageOfEl(els[mid]) >= _rmIdx) hi = mid; else lo = mid + 1; }
  return els[lo] || null;
}

function bmAdd() {
  if (!document.getElementById('rm')) return;
  let ci, pi, t = null;
  const active = _hasAudio && _lastFlatIdx >= 0 ? _flatParas[_lastFlatIdx] : null;
  if (active && typeof active.pi === 'number' && active.el && pageOfEl(active.el) <= _rmIdx && audio.currentTime <= active.end + 2) {
    // The spot being read aloud, when it is on the page in view
    ci = active.ci; pi = active.pi; t = audio.currentTime;
  } else {
    const el = firstParaOnPage();
    if (!el) return;
    ci = parseInt(el.dataset.ci); pi = parseInt(el.dataset.pi);
    t = SYNC_DATA[ci].paragraphs[pi].start;
  }
  const btn = document.getElementById('rm-bm-btn');
  if (btn) { btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 500); }
  if (_bookmarks.some(b => b.ci === ci && b.pi === pi)) return;
  _bookmarks.push({ id: Date.now(), ci, pi, t, text: SYNC_DATA[ci].paragraphs[pi].text.slice(0, 120) });
  _bookmarks.sort((a, b) => a.ci - b.ci || a.pi - b.pi);
  bmSave();
  bmRender();
}

function bmRemove(id) {
  _bookmarks = _bookmarks.filter(b => b.id !== id);
  bmSave();
  bmRender();
}

function bmJump(id) {
  const b = _bookmarks.find(x => x.id === id);
  if (!b) return;
  rmToggleToc();
  if (_hasAudio && b.t !== null && b.t !== undefined) audio.currentTime = b.t;
  const el = document.querySelector(`#rm-strip p[data-ci="${b.ci}"][data-pi="${b.pi}"]`);
  if (el) rmGo(pageOfEl(el), false);
}

function bmRender() {
  const list = document.getElementById('rm-bm-list');
  const tab = document.getElementById('rm-tab-bm');
  if (!list) return;
  if (tab) tab.textContent = _bookmarks.length ? `BOOKMARKS ${_bookmarks.length}` : 'BOOKMARKS';
  const color = rmGetResolvedTheme().light ? '#3a2828' : '#bbb';
  const esc = str => str.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  list.innerHTML = _bookmarks.length ? _bookmarks.map(b => {
    const num = SYNC_DATA[b.ci] ? chLabel(b.ci).split(':')[0].replace('Chapter ', 'Ch.') : '';
    const when = b.t !== null && b.t !== undefined ? ' · ' + fmt(b.t) : '';
    return `<div class="rm-toc-item rm-bm-item" style="color:${color}" onclick="bmJump(${b.id})">
      <div class="rm-bm-body"><div class="rm-bm-meta">${num}${when}</div><div class="rm-bm-text">${esc(b.text)}</div></div>
      <button class="rm-bm-del" title="Remove" onclick="event.stopPropagation();bmRemove(${b.id})">✕</button>
    </div>`;
  }).join('') : `<div class="rm-bm-empty" style="color:${color}">No bookmarks yet.<br>Press B or the 🔖 button to mark the spot you are at.</div>`;

  // Dot beside each bookmarked paragraph
  document.querySelectorAll('#rm-strip p.ss-bm').forEach(el => el.classList.remove('ss-bm'));
  _bookmarks.forEach(b => {
    const el = document.querySelector(`#rm-strip p[data-ci="${b.ci}"][data-pi="${b.pi}"]`);
    if (el) el.classList.add('ss-bm');
  });
}

function rmTocTab(which) {
  document.getElementById('rm-tab-ch').classList.toggle('on', which === 'ch');
  document.getElementById('rm-tab-bm').classList.toggle('on', which === 'bm');
  document.getElementById('rm-toc-list').style.display = which === 'ch' ? '' : 'none';
  document.getElementById('rm-bm-list').style.display = which === 'bm' ? '' : 'none';
}

function startApp(url, resumeTime) {
  audio.src = url;
  _hasAudio = true;
  if (resumeTime > 0) {
    audio.addEventListener('loadedmetadata', () => { audio.currentTime = resumeTime; }, {once:true});
  }
  document.getElementById('upload-overlay').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  document.getElementById('player').classList.add('visible');
  document.getElementById('autoscroll-btn').classList.add('active');
  buildChapterSelect();
  openReader(0, 0);
  startPosSave();
}

function buildChapterSelect() {
  const sel = document.getElementById('ch-jump-sel');
  if (!sel) return;
  sel.innerHTML = SYNC_DATA.map((ch, i) =>
    `<option value="${i}">${escHtml(chLabel(i).replace('Chapter ','Ch.'))}</option>`
  ).join('');
}

function startWithoutAudio() {
  _hasAudio = false;
  document.getElementById('upload-overlay').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  buildChapterSelect();
  openReader(0, 0);
}

// ── File System Access API persistence ──
async function saveFileHandle(fileHandle, fileName) {
  try {
    await ssDBSet('audioHandle', fileHandle);
    await ssDBSet('audioName', fileName);
  } catch(e) {}
}

async function tryResumeSession() {
  if (!('showOpenFilePicker' in window)) return; // API not supported
  try {
    const handle = await ssDBGet('audioHandle');
    const name   = await ssDBGet('audioName');
    if (!handle) return;
    // Show resume button on upload screen
    const resumePos = parseFloat(localStorage.getItem('ssAudioPos_'+BOOK_ID) || '0');
    const pageIdx   = parseInt(localStorage.getItem('ssPageIdx_'+BOOK_ID) || '0');
    showResumeButton(name || 'audiobook', resumePos, pageIdx, async () => {
      try {
        const perm = await handle.queryPermission({mode:'read'});
        const granted = perm === 'granted' || (await handle.requestPermission({mode:'read'})) === 'granted';
        if (!granted) { hideResumeButton(); return; }
        const file = await handle.getFile();
        startApp(URL.createObjectURL(file), resumePos);
      } catch(e) { hideResumeButton(); }
    });
  } catch(e) {}
}

function showResumeButton(name, pos, page, onResume) {
  const overlay = document.getElementById('upload-overlay');
  const existing = document.getElementById('ss-resume-btn');
  if (existing) existing.remove();
  const fmtPos = pos > 0 ? ` · ${Math.floor(pos/3600)}h${String(Math.floor((pos%3600)/60)).padStart(2,'0')}m` : '';
  const btn = document.createElement('button');
  btn.id = 'ss-resume-btn';
  btn.style.cssText = 'font-family:var(--font-ui);font-size:11px;letter-spacing:1px;color:var(--accent);background:rgba(var(--accent-rgb),.08);border:1px solid rgba(var(--accent-rgb),.3);border-radius:4px;padding:10px 20px;cursor:pointer;margin-top:4px;transition:all .4s;';
  btn.textContent = `↺ RESUME  ${name}${fmtPos}`;
  btn.onmouseover = () => btn.style.background = 'rgba(var(--accent-rgb),.15)';
  btn.onmouseout  = () => btn.style.background = 'rgba(var(--accent-rgb),.08)';
  btn.onclick = onResume;
  // Insert before the skip button
  const skip = overlay.querySelector('.upload-skip');
  overlay.insertBefore(btn, skip);
}

function hideResumeButton() {
  const btn = document.getElementById('ss-resume-btn');
  if (btn) btn.remove();
}

// Hook file input and drop to also save handle
const audioInput = document.getElementById('audio-input');
audioInput.onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  document.getElementById('audio-fname').textContent = f.name;
  // Try to get a persistent handle via showOpenFilePicker if available,
  // otherwise fall back to just saving the name (no auto-resume)
  if ('showOpenFilePicker' in window) {
    try {
      // We can't get a handle from <input> — use the file directly but
      // also prompt picker for the handle
      // Actually: use DataTransfer item if available
      const item = e.target.files[0];
      // Store name for display; handle only obtainable via picker
      await ssDBSet('audioName', f.name);
    } catch(e2) {}
  }
  const resumePos = parseFloat(localStorage.getItem('ssAudioPos_'+BOOK_ID) || '0');
  startApp(URL.createObjectURL(f), resumePos);
};

const dropZone = document.getElementById('audio-drop');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('audio/')) {
    document.getElementById('audio-fname').textContent = f.name;
    const resumePos = parseFloat(localStorage.getItem('ssAudioPos_'+BOOK_ID) || '0');
    startApp(URL.createObjectURL(f), resumePos);
  }
});

// Override file picker to use showOpenFilePicker for handle persistence
dropZone.addEventListener('click', async e => {
  if (!('showOpenFilePicker' in window)) return; // let default input handle it
  e.preventDefault();
  e.stopPropagation();
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Audio', accept: { 'audio/*': ['.mp3','.m4b','.m4a','.ogg','.wav','.flac'] } }],
      multiple: false
    });
    await saveFileHandle(handle, handle.name);
    const file = await handle.getFile();
    document.getElementById('audio-fname').textContent = file.name;
    const resumePos = parseFloat(localStorage.getItem('ssAudioPos_'+BOOK_ID) || '0');
    startApp(URL.createObjectURL(file), resumePos);
  } catch(e2) { /* user cancelled */ }
});

// Saved speed and volume apply before any file is loaded
const savedVol = Number(_playerPrefs.vol);
audio.volume = savedVol >= 0 && savedVol <= 1 ? savedVol : 1;
audio.muted = !!_playerPrefs.muted;
volSlider.value = audio.volume;
volSlider.style.setProperty('--vol', (audio.volume * 100) + '%');
document.getElementById('mute-btn').textContent = audio.muted || audio.volume === 0 ? '🔇' : '🔊';
const savedSpeed = _speeds.indexOf(_playerPrefs.speed);
setSpeed(savedSpeed >= 0 ? savedSpeed : 1);

document.getElementById('splash-title').textContent = BOOK_TITLE;
document.querySelector('#upload-overlay .upload-title').textContent = BOOK_TITLE;
document.title = BOOK_TITLE + ' — Synced Reader';

// On load: use the named audio file if it is there, otherwise ask for one
if (AUDIO_FILE_PATH) {
  const overlay = document.getElementById('upload-overlay');
  const url = AUDIO_FILE_PATH.split('/').map(encodeURIComponent).join('/');
  const probe = new Audio();
  probe.preload = 'metadata';
  overlay.classList.add('hidden');
  probe.addEventListener('loadedmetadata', () => {
    startApp(url, parseFloat(localStorage.getItem('ssAudioPos_'+BOOK_ID) || '0'));
  }, { once: true });
  probe.addEventListener('error', () => {
    overlay.classList.remove('hidden');
    document.getElementById('audio-fname').textContent = AUDIO_FILE_PATH + ' is not next to this file. Pick the audio.';
    tryResumeSession();
  }, { once: true });
  probe.src = url;
} else {
  tryResumeSession();
}

// Surface audio load failures instead of a silent player
audio.addEventListener('error', () => {
  const f = document.getElementById('audio-fname');
  if (f) f.textContent = 'Could not load this audio file. Pick it again.';
});
</script>
